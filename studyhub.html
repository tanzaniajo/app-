<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StudyHub — English · Math · Science · Chinese</title>
<meta name="description" content="Bite-sized lessons in English, Math, Science and Chinese, matched to your age and school year.">
<style>
/* ============================================================
   StudyHub — a lesson-path study app for English, Math,
   Science and Chinese. Chunky, playful, keyboard friendly.
   ============================================================ */

:root {
  --green: #58cc02;
  --green-dark: #46a302;
  --green-tint: #d7ffb8;
  --blue: #1cb0f6;
  --blue-dark: #1899d6;
  --blue-tint: #ddf4ff;
  --red: #ff4b4b;
  --red-dark: #ea2b2b;
  --red-tint: #ffdfe0;
  --yellow: #ffc800;
  --yellow-dark: #e6a400;
  --orange: #ff9600;
  --purple: #ce82ff;

  --bg: #ffffff;
  --card: #ffffff;
  --sunk: #f7f7f7;
  --line: #e5e5e5;
  --line-strong: #d4d4d4;
  --text: #3c3c3c;
  --text-dim: #afafaf;

  --english: #1cb0f6;
  --math: #ff9600;
  --science: #58cc02;
  --chinese: #ff4b4b;
  --chess: #ce82ff;

  --radius: 16px;
  /* system rounded stack: no network fetch, so the app works fully offline */
  --font: ui-rounded, "SF Pro Rounded", "Segoe UI Variable Display", "Segoe UI",
          system-ui, -apple-system, Roboto, "Noto Sans SC", "PingFang SC",
          "Microsoft YaHei", sans-serif;
}

:root[data-theme="dark"] {
  --bg: #131f24;
  --card: #1b2b32;
  --sunk: #202f36;
  --line: #37464f;
  --line-strong: #46565f;
  --text: #f1f7fb;
  --text-dim: #7f97a3;
  --green-tint: #202f1a;
  --red-tint: #331c1f;
  --blue-tint: #17323f;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  font-weight: 700;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3 { margin: 0; font-weight: 800; letter-spacing: -.02em; }
button { font-family: inherit; }

/* ---------------- chunky buttons ---------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 0; border-radius: var(--radius);
  padding: 14px 22px; min-height: 50px;
  font-size: .95rem; font-weight: 800; letter-spacing: .8px; text-transform: uppercase;
  color: #fff; background: var(--green);
  box-shadow: 0 4px 0 var(--green-dark);
  cursor: pointer; user-select: none;
  transition: filter .1s ease;
}
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(4px); box-shadow: none; }
.btn--blue { background: var(--blue); box-shadow: 0 4px 0 var(--blue-dark); }
.btn--red { background: var(--red); box-shadow: 0 4px 0 var(--red-dark); }
.btn--ghost {
  background: transparent; color: var(--text-dim);
  border: 2px solid var(--line); border-bottom-width: 4px; box-shadow: none;
}
.btn--ghost:active { transform: translateY(2px); border-bottom-width: 2px; }
.btn[disabled] {
  background: var(--line); color: var(--text-dim); box-shadow: none;
  cursor: not-allowed; filter: none;
}
.btn[disabled]:active { transform: none; }
.btn--wide { width: 100%; }

.link {
  background: none; border: 0; padding: 0; cursor: pointer;
  color: var(--blue); font-weight: 800; font-size: .88rem;
  text-transform: uppercase; letter-spacing: .6px;
}
.link:hover { filter: brightness(1.1); }

/* ---------------- top HUD ---------------- */
.hud {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 10px;
  padding: 12px 18px;
  background: var(--bg);
  border-bottom: 2px solid var(--line);
}
.hud .brand {
  display: flex; align-items: center; gap: 8px;
  background: none; border: 0; cursor: pointer; padding: 0;
  color: var(--green); font-size: 1.15rem; font-weight: 800; letter-spacing: -.02em;
}
.hud-spacer { flex: 1; }
.stat-pill {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 1rem; font-weight: 800; color: var(--text-dim);
  background: none; border: 0; padding: 4px 6px; border-radius: 10px; cursor: default;
}
.stat-pill.fire { color: var(--orange); }
.stat-pill.gem { color: var(--blue); }
.stat-pill.heart { color: var(--red); }
.stat-pill.dim { color: var(--text-dim); }
.icon-btn {
  background: none; border: 0; cursor: pointer; font-size: 1.1rem;
  padding: 6px 8px; border-radius: 10px; color: var(--text-dim);
}
.icon-btn:hover { background: var(--sunk); }

/* ---------------- layout ---------------- */
.wrap { max-width: 640px; margin: 0 auto; padding: 22px 18px 90px; }
.wrap--wide { max-width: 860px; }
.center { text-align: center; }
.muted { color: var(--text-dim); font-weight: 700; }
.small { font-size: .85rem; }

/* ---------------- onboarding ---------------- */
.onboard {
  min-height: calc(100vh - 0px);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 40px 20px 60px; gap: 8px; text-align: center;
}
.mascot { font-size: 4.5rem; line-height: 1; margin-bottom: 6px; }
.onboard h1 { font-size: 1.7rem; margin-bottom: 6px; }
.onboard p { color: var(--text-dim); margin: 0 0 24px; max-width: 420px; }
.speech {
  position: relative; background: var(--sunk); border: 2px solid var(--line);
  border-radius: 14px; padding: 12px 16px; max-width: 380px; margin: 0 auto 26px;
  font-weight: 700; color: var(--text);
}
.speech::after {
  content: ''; position: absolute; left: 50%; bottom: -10px; transform: translateX(-50%);
  border: 9px solid transparent; border-top-color: var(--line); border-bottom: 0;
}
.age-grid {
  display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  width: 100%; max-width: 440px; margin-bottom: 20px;
}
.age-input {
  display: flex; gap: 10px; width: 100%; max-width: 320px; margin: 0 auto 18px;
}
.age-input input {
  flex: 1; min-width: 0; text-align: center;
  font: inherit; font-size: 1.4rem; font-weight: 800;
  padding: 12px; border-radius: 14px;
  border: 2px solid var(--line); border-bottom-width: 4px;
  background: var(--bg); color: var(--text);
}
.age-input input:focus { outline: none; border-color: var(--blue); }
.step-dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 22px; }
.step-dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.step-dots i.on { background: var(--green); }

/* option tiles (onboarding + course picker) */
.tile {
  display: flex; align-items: center; gap: 12px; width: 100%;
  background: var(--card); color: var(--text);
  border: 2px solid var(--line); border-bottom-width: 4px; border-radius: var(--radius);
  padding: 14px 16px; cursor: pointer; text-align: left; font-weight: 800;
}
.tile:hover { background: var(--sunk); }
.tile.sel { border-color: var(--blue); background: var(--blue-tint); color: var(--blue-dark); }
.tile .emoji { font-size: 1.6rem; }
.tile .tile-sub { display: block; font-size: .8rem; font-weight: 700; color: var(--text-dim); }
.tile.sel .tile-sub { color: var(--blue-dark); }

/* ---------------- course switcher ---------------- */
.courses { display: flex; gap: 8px; overflow-x: auto; padding: 14px 18px 4px; max-width: 640px; margin: 0 auto; }
.course-chip {
  flex: none; display: flex; align-items: center; gap: 7px;
  border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 14px;
  background: var(--card); color: var(--text-dim);
  padding: 8px 13px; cursor: pointer; font-weight: 800; font-size: .88rem;
}
.course-chip .emoji { font-size: 1.1rem; }
.course-chip.on { border-color: currentColor; background: var(--sunk); }

/* ---------------- learning path ---------------- */
.unit {
  background: var(--sub, var(--green));
  border-radius: var(--radius);
  color: #fff; padding: 14px 18px; margin: 22px 0 6px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  box-shadow: 0 4px 0 rgba(0,0,0,.18);
}
.unit-title { font-size: 1.05rem; font-weight: 800; }
.unit-sub { font-size: .8rem; font-weight: 700; opacity: .9; }
.unit-crowns { font-size: .95rem; font-weight: 800; white-space: nowrap; }

.path { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 18px 0 6px; }
.path-row { display: flex; justify-content: center; width: 100%; }
.node {
  position: relative;
  width: 72px; height: 66px; border: 0; border-radius: 50%;
  background: var(--sub, var(--green));
  box-shadow: 0 6px 0 rgba(0,0,0,.22);
  color: #fff; font-size: 1.5rem; cursor: pointer;
  display: grid; place-items: center;
}
.node:active { transform: translateY(5px); box-shadow: 0 1px 0 rgba(0,0,0,.22); }
.node.locked { background: var(--line); box-shadow: 0 6px 0 var(--line-strong); color: var(--text-dim); }
.node.done { background: var(--yellow); box-shadow: 0 6px 0 var(--yellow-dark); }
.node.current::before {
  content: ''; position: absolute; inset: -7px; border-radius: 50%;
  border: 4px solid var(--sub, var(--green)); opacity: .35;
}
.node-flag {
  position: absolute; top: -34px; left: 50%; transform: translateX(-50%);
  background: var(--card); color: var(--sub, var(--green));
  border: 2px solid var(--line); border-bottom-width: 3px; border-radius: 10px;
  padding: 3px 10px; font-size: .68rem; font-weight: 800; letter-spacing: .8px;
  text-transform: uppercase; white-space: nowrap;
}
.path-note { text-align: center; color: var(--text-dim); font-size: .82rem; margin-top: 4px; }

.section-head { display: flex; align-items: center; justify-content: space-between; margin: 30px 0 10px; gap: 10px; }
.section-head h2 { font-size: 1.05rem; }

/* daily goal card */
.goal-card {
  display: flex; align-items: center; gap: 14px;
  border: 2px solid var(--line); border-radius: var(--radius);
  padding: 14px 16px; background: var(--card); margin-top: 6px;
}
.goal-ring {
  width: 46px; height: 46px; flex: none; border-radius: 50%;
  display: grid; place-items: center; font-size: 1.3rem;
  background: var(--sunk);
}
.goal-body { flex: 1; min-width: 0; }
.goal-body .goal-title { font-size: .95rem; }
.track { height: 12px; border-radius: 999px; background: var(--line); overflow: hidden; margin-top: 6px; }
.track > i { display: block; height: 100%; border-radius: 999px; background: var(--green); transition: width .3s ease; }
.track.blue > i { background: var(--blue); }

/* ---------------- lesson ---------------- */
.lesson-top {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 12px;
  padding: 14px 18px; background: var(--bg);
  max-width: 700px; margin: 0 auto;
}
.close-x {
  background: none; border: 0; cursor: pointer; color: var(--text-dim);
  font-size: 1.5rem; line-height: 1; padding: 0 4px;
}
.lesson-body { max-width: 700px; margin: 0 auto; padding: 10px 18px 190px; }
.kicker {
  font-size: .72rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
  color: var(--text-dim); margin-bottom: 10px;
}
.passage {
  background: var(--sunk); border-radius: 14px; padding: 14px 16px;
  font-weight: 700; font-size: .93rem; line-height: 1.65; color: var(--text);
  margin-bottom: 18px;
}
.prompt { font-size: 1.35rem; font-weight: 800; line-height: 1.4; margin: 0 0 20px; }
.prompt.big { font-size: 3.2rem; line-height: 1.15; }
.prompt.script { font-size: 3.6rem; }

.options { display: grid; gap: 11px; }
.option {
  display: flex; align-items: center; gap: 13px; width: 100%;
  background: var(--card); color: var(--text);
  border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 14px;
  padding: 14px 16px; cursor: pointer; text-align: left;
  font-weight: 700; font-size: 1rem;
}
.option:hover:not([disabled]) { background: var(--sunk); }
.option .key {
  width: 26px; height: 26px; flex: none; border-radius: 8px;
  border: 2px solid var(--line); color: var(--text-dim);
  display: grid; place-items: center; font-size: .74rem; font-weight: 800;
}
.option.sel { border-color: var(--blue); background: var(--blue-tint); color: var(--blue-dark); }
.option.sel .key { border-color: var(--blue); color: var(--blue-dark); }
.option.right { border-color: var(--green); background: var(--green-tint); color: var(--green-dark); }
.option.right .key { border-color: var(--green-dark); color: var(--green-dark); }
.option.wrong { border-color: var(--red); background: var(--red-tint); color: var(--red-dark); }
.option.wrong .key { border-color: var(--red-dark); color: var(--red-dark); }
.option[disabled] { cursor: default; }

.type-answer {
  width: 100%; font: inherit; font-size: 1.15rem; font-weight: 700;
  padding: 15px 16px; border-radius: 14px;
  border: 2px solid var(--line); border-bottom-width: 4px;
  background: var(--card); color: var(--text);
}
.type-answer:focus { outline: none; border-color: var(--blue); }
.type-answer[disabled] { opacity: .75; }

/* bottom bar + feedback */
.footbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  border-top: 2px solid var(--line); background: var(--bg);
}
.footbar.ok { background: var(--green-tint); border-top-color: transparent; }
.footbar.no { background: var(--red-tint); border-top-color: transparent; }
.footbar-inner {
  max-width: 700px; margin: 0 auto; padding: 16px 18px;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
.verdict { flex: 1; min-width: 200px; }
.verdict .headline { font-size: 1.1rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.footbar.ok .verdict { color: var(--green-dark); }
.footbar.no .verdict { color: var(--red-dark); }
.verdict .why { font-size: .86rem; font-weight: 700; opacity: .95; margin-top: 3px; }
.footbar .btn { min-width: 160px; }

/* ---------------- results ---------------- */
.result { text-align: center; padding: 30px 18px 40px; max-width: 640px; margin: 0 auto; }
.result .mascot { margin-bottom: 4px; }
.result h1 { font-size: 1.8rem; margin-bottom: 6px; }
.result .subline { color: var(--text-dim); margin-bottom: 24px; }
.tally { display: flex; gap: 12px; justify-content: center; margin-bottom: 26px; flex-wrap: wrap; }
.tally-box {
  flex: 1; min-width: 130px; border-radius: 14px; padding: 3px;
  background: var(--yellow); box-shadow: 0 3px 0 var(--yellow-dark);
}
.tally-box.blue { background: var(--blue); box-shadow: 0 3px 0 var(--blue-dark); }
.tally-box.green { background: var(--green); box-shadow: 0 3px 0 var(--green-dark); }
.tally-label {
  color: #fff; font-size: .68rem; font-weight: 800; letter-spacing: .1em;
  text-transform: uppercase; padding: 5px;
}
.tally-value {
  background: var(--card); border-radius: 12px; padding: 10px;
  font-size: 1.5rem; font-weight: 800;
}
.tally-box .tally-value { color: var(--yellow-dark); }
.tally-box.blue .tally-value { color: var(--blue); }
.tally-box.green .tally-value { color: var(--green); }

.review { text-align: left; display: grid; gap: 8px; margin: 26px 0; }
.review-item {
  border: 2px solid var(--line); border-radius: 12px; padding: 10px 13px;
  font-size: .88rem; font-weight: 700; background: var(--card);
}
.review-item.miss { border-color: var(--red); background: var(--red-tint); color: var(--red-dark); }
.review-item .r-a { font-weight: 700; opacity: .85; margin-top: 2px; }

/* ---------------- stats ---------------- */
.stat-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.stat-card {
  border: 2px solid var(--line); border-radius: var(--radius); padding: 14px 16px;
  display: flex; align-items: center; gap: 12px; background: var(--card);
}
.stat-card .big { font-size: 1.5rem; font-weight: 800; }
.stat-card .cap { font-size: .78rem; font-weight: 700; color: var(--text-dim); }
.rows { display: grid; gap: 8px; margin-top: 12px; }
.row {
  display: flex; align-items: center; gap: 12px;
  border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; background: var(--card);
}
.row-main { flex: 1; min-width: 0; }
.row-main .row-title { font-size: .95rem; }
.row-main .row-sub { font-size: .78rem; color: var(--text-dim); font-weight: 700; }
.row-num { font-size: 1rem; font-weight: 800; white-space: nowrap; }

.empty { text-align: center; color: var(--text-dim); padding: 40px 20px; font-weight: 700; }

.modal-backdrop {
  position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.45);
  display: grid; place-items: center; padding: 20px;
}
.modal {
  background: var(--card); border-radius: 20px; padding: 26px 22px;
  max-width: 380px; width: 100%; text-align: center;
}
.modal h2 { font-size: 1.25rem; margin-bottom: 8px; }
.modal p { color: var(--text-dim); font-weight: 700; margin: 0 0 20px; }
.modal .btn { width: 100%; margin-bottom: 10px; }

@media (max-width: 520px) {
  .prompt { font-size: 1.2rem; }
  .prompt.big { font-size: 2.6rem; }
  .prompt.script { font-size: 3rem; }
  .footbar .btn { width: 100%; }
  .node { width: 64px; height: 60px; font-size: 1.3rem; }
}

/* ---------------- chess board ---------------- */
.board-wrap { margin: 0 auto 20px; width: min(340px, 82vw); }
.board {
  display: grid; grid-template-columns: repeat(8, 1fr);
  border-radius: 10px; overflow: hidden;
  box-shadow: 0 3px 0 rgba(0,0,0,.25);
}
.board .sq {
  position: relative;
  aspect-ratio: 1 / 1; display: grid; place-items: center;
  line-height: 1;
}
.board .sq.light { background: #eeeed2; }
.board .sq.dark  { background: #769656; }
.board .piece {
  width: 88%; height: 88%;
  display: block; pointer-events: none;
  /* the piece is lifted into its own layer so moves animate smoothly */
  will-change: transform;
}
.board .piece svg { width: 100%; height: 100%; display: block; }
.board .piece.moving { z-index: 6; }

/* coordinates in the corner of the edge squares */
.board .coord {
  position: absolute; font-size: .62rem; font-weight: 800; line-height: 1;
  pointer-events: none; user-select: none;
}
.board .coord.rank { top: 3px; left: 3px; }
.board .coord.file { bottom: 3px; right: 4px; }
.board .sq.light .coord { color: #769656; }
.board .sq.dark  .coord { color: #eeeed2; }

/* ---------------- playing a game ---------------- */
.play-card {
  display: flex; align-items: center; gap: 14px; width: 100%;
  border: 2px solid var(--chess); border-bottom-width: 4px; border-radius: var(--radius);
  background: var(--card); color: var(--text);
  padding: 14px 16px; margin-top: 14px; cursor: pointer; text-align: left; font: inherit;
}
.play-card:hover { background: var(--sunk); }
.play-emoji { font-size: 1.8rem; }
.play-body { flex: 1; min-width: 0; }
.play-title { font-weight: 800; font-size: 1rem; }
.play-go { color: var(--chess); font-size: 1.1rem; font-weight: 800; }

.board--play .sq {
  position: relative; border: 0; padding: 0; cursor: pointer;
  font-family: inherit;
}
.board--play .sq.last { box-shadow: inset 0 0 0 100px rgba(255, 232, 92, .55); }
.board--play .sq.sel  { box-shadow: inset 0 0 0 100px rgba(255, 232, 92, .72); }
.board--play .sq.check {
  background-image: radial-gradient(circle at 50% 50%, rgba(255,60,60,.95) 12%, rgba(255,60,60,.55) 46%, rgba(255,60,60,0) 72%);
}
.board--play .sq.premove { box-shadow: inset 0 0 0 100px rgba(101, 173, 255, .62); }
.board--play .piece { position: relative; z-index: 2; }
.target {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 30%; height: 30%; border-radius: 50%;
  background: rgba(20, 20, 20, .26); z-index: 1; pointer-events: none;
}
.target.take {
  width: 92%; height: 92%; background: transparent;
  border: 6px solid rgba(20, 20, 20, .22); border-radius: 50%;
}
.premove-note {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: rgba(101, 173, 255, .16); color: var(--blue-dark);
  border-radius: 10px; padding: 8px 12px; margin-top: 10px;
  font-size: .82rem; font-weight: 800;
}
html[data-theme="dark"] .premove-note { color: #9dd0ff; }

.play-status {
  margin: 16px 0 12px; padding: 12px 14px; border-radius: 12px;
  background: var(--sunk); font-weight: 800; text-align: center;
}
.play-status.over { background: var(--green-tint); color: var(--green-dark); }
.play-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
.play-actions .btn { flex: 1; min-width: 100px; min-height: 44px; padding: 10px 12px; font-size: .82rem; }

.movelist {
  max-height: 168px; overflow-y: auto;
  border: 2px solid var(--line); border-radius: 12px; padding: 8px 10px; background: var(--card);
}
.move-row { display: grid; grid-template-columns: 34px 1fr 1fr; gap: 6px; font-size: .9rem; }
.move-no { color: var(--text-dim); }
.move-san { font-weight: 800; }

.promo-row { display: flex; gap: 8px; justify-content: center; margin-bottom: 8px; }
.promo-btn {
  flex: 1; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 12px;
  background: var(--card); cursor: pointer; padding: 10px 4px;
  display: flex; flex-direction: column; align-items: center; gap: 4px; font: inherit;
}
.promo-btn:hover { background: var(--sunk); }
.promo-btn .piece { width: 42px; height: 42px; display: block; }

<body>

<div id="hud"></div>
<main id="app"></main>

<script>
/* State: learner profile, XP, hearts, streak and per-lesson progress. All in localStorage. */
window.StudyHub = window.StudyHub || {};

(function (SH) {
  'use strict';

  var KEY = 'studyhub.state.v2';
  var PROFILE_KEY = 'studyhub.profile.v2';
  var THEME_KEY = 'studyhub.theme';

  var MAX_HEARTS = 5;
  var HEART_REFILL_MS = 20 * 60 * 1000;   // one heart every 20 minutes
  var LESSONS_PER_UNIT = 5;
  var QUESTIONS_PER_LESSON = 8;
  var XP_PER_LESSON = 10;

  var blank = {
    xp: 0,
    hearts: { n: MAX_HEARTS, ts: 0 },
    lessons: {},         // "subject/topic/0" -> { done: true, best: 90 }
    topics: {},          // "subject/topic"   -> { asked, correct, sessions }
    totals: { asked: 0, correct: 0 },
    days: {},            // "YYYY-MM-DD" -> questions answered
    mistakes: [],        // wrong answers kept for the Coach to review
    goal: 30,            // daily XP goal
    streak: { current: 0, best: 0, last: null }
  };

  function clone(x) { return JSON.parse(JSON.stringify(x)); }

  function read() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return clone(blank);
      var data = JSON.parse(raw);
      for (var k in blank) if (!(k in data)) data[k] = clone(blank[k]);
      return data;
    } catch (e) { return clone(blank); }
  }

  function write(data) {
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* private mode: run unsaved */ }
    return data;
  }

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function today() {
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function dayDiff(a, b) {
    return Math.round((Date.parse(b + 'T00:00:00') - Date.parse(a + 'T00:00:00')) / 86400000);
  }

  /* Hearts regenerate with time, so they are always recomputed on read. */
  function settleHearts(data) {
    var h = data.hearts || { n: MAX_HEARTS, ts: 0 };
    if (h.n >= MAX_HEARTS) { h.n = MAX_HEARTS; h.ts = 0; data.hearts = h; return data; }
    if (!h.ts) h.ts = Date.now();
    var gained = Math.floor((Date.now() - h.ts) / HEART_REFILL_MS);
    if (gained > 0) {
      h.n = Math.min(MAX_HEARTS, h.n + gained);
      h.ts = h.n >= MAX_HEARTS ? 0 : h.ts + gained * HEART_REFILL_MS;
    }
    data.hearts = h;
    return data;
  }

  var Progress = {
    all: function () { return write(settleHearts(read())); },

    /* ---- hearts ---- */
    hearts: function () { return Progress.all().hearts.n; },
    heartsMax: MAX_HEARTS,
    msToNextHeart: function () {
      var d = Progress.all();
      if (d.hearts.n >= MAX_HEARTS) return 0;
      return Math.max(0, HEART_REFILL_MS - (Date.now() - d.hearts.ts));
    },
    loseHeart: function () {
      var d = Progress.all();
      if (d.hearts.n === MAX_HEARTS) d.hearts.ts = Date.now();
      d.hearts.n = Math.max(0, d.hearts.n - 1);
      write(d);
      return d.hearts.n;
    },
    refillHearts: function () {
      var d = Progress.all();
      d.hearts.n = MAX_HEARTS;
      d.hearts.ts = 0;
      return write(d).hearts.n;
    },
    gainHeart: function () {
      var d = Progress.all();
      if (d.hearts.n < MAX_HEARTS) { d.hearts.n += 1; if (d.hearts.n >= MAX_HEARTS) d.hearts.ts = 0; }
      return write(d).hearts.n;
    },

    /* ---- lessons ----
       Keys carry the syllabus stage, because a lesson cleared as a nine-year-old
       is not the same lesson as an adult sees. Changing your age therefore gives
       you a fresh path, and changing back restores the one you had. */
    stageId: function () {
      var p = Profile.get();
      return p ? p.stage.id : 'middle';
    },
    lessonKey: function (s, t, i) { return Progress.stageId() + '/' + s + '/' + t + '/' + i; },
    lesson: function (s, t, i) { return Progress.all().lessons[Progress.lessonKey(s, t, i)] || null; },
    crowns: function (s, t) {
      var d = Progress.all(), n = 0;
      for (var i = 0; i < LESSONS_PER_UNIT; i++) if (d.lessons[Progress.lessonKey(s, t, i)]) n++;
      return n;
    },
    unitComplete: function (s, t) { return Progress.crowns(s, t) >= LESSONS_PER_UNIT; },

    /* Records a finished lesson: XP, streak, accuracy and the crown. */
    finishLesson: function (opts) {
      var d = Progress.all();
      var key = opts.subject + '/' + opts.topic;
      var lessonKey = Progress.lessonKey(opts.subject, opts.topic, opts.lesson);
      var pct = opts.asked ? Math.round((opts.correct / opts.asked) * 100) : 0;

      if (opts.passed) {
        var prev = d.lessons[lessonKey];
        d.lessons[lessonKey] = { done: true, best: Math.max(pct, prev ? prev.best : 0) };
        d.xp += opts.xp == null ? XP_PER_LESSON : opts.xp;
      }

      var t = d.topics[key] || { asked: 0, correct: 0, sessions: 0 };
      t.asked += opts.asked;
      t.correct += opts.correct;
      t.sessions += 1;
      d.topics[key] = t;

      d.totals.asked += opts.asked;
      d.totals.correct += opts.correct;

      var day = today();
      d.days[day] = (d.days[day] || 0) + opts.asked;

      if (d.streak.last !== day) {
        d.streak.current = (d.streak.last && dayDiff(d.streak.last, day) === 1) ? d.streak.current + 1 : 1;
        d.streak.last = day;
        if (d.streak.current > d.streak.best) d.streak.best = d.streak.current;
      }

      return write(d);
    },

    /* ---- the mistake log the Coach reviews ---- */
    MAX_MISTAKES: 60,
    logMistake: function (record) {
      var d = Progress.all();
      record.id = 'm' + Date.now() + Math.floor(Math.random() * 1000);
      record.ts = Date.now();
      // the same slip twice is one entry, refreshed
      d.mistakes = d.mistakes.filter(function (x) {
        return !(x.prompt === record.prompt && x.given === record.given);
      });
      d.mistakes.unshift(record);
      if (d.mistakes.length > Progress.MAX_MISTAKES) d.mistakes.length = Progress.MAX_MISTAKES;
      return write(d);
    },
    mistakes: function () { return Progress.all().mistakes; },
    removeMistake: function (id) {
      var d = Progress.all();
      d.mistakes = d.mistakes.filter(function (x) { return x.id !== id; });
      return write(d);
    },
    clearMistakes: function () {
      var d = Progress.all();
      d.mistakes = [];
      return write(d);
    },

    /* XP earned outside a lesson — playing a game of chess, for instance.
       It counts toward the daily goal and the streak, like any other activity. */
    addXp: function (xp, activity) {
      var d = Progress.all();
      d.xp += xp;
      var day = today();
      d.days[day] = (d.days[day] || 0) + (activity == null ? 1 : activity);
      if (d.streak.last !== day) {
        d.streak.current = (d.streak.last && dayDiff(d.streak.last, day) === 1) ? d.streak.current + 1 : 1;
        d.streak.last = day;
        if (d.streak.current > d.streak.best) d.streak.best = d.streak.current;
      }
      return write(d);
    },

    /* ---- rollups for the stats page ---- */
    subject: function (subjectId) {
      var d = Progress.all(), out = { asked: 0, correct: 0, sessions: 0, crowns: 0 };
      Object.keys(d.topics).forEach(function (k) {
        if (k.indexOf(subjectId + '/') !== 0) return;
        out.asked += d.topics[k].asked;
        out.correct += d.topics[k].correct;
        out.sessions += d.topics[k].sessions;
      });
      var prefix = Progress.stageId() + '/' + subjectId + '/';
      Object.keys(d.lessons).forEach(function (k) {
        if (k.indexOf(prefix) === 0) out.crowns++;
      });
      return out;
    },
    topic: function (s, t) {
      return Progress.all().topics[s + '/' + t] || { asked: 0, correct: 0, sessions: 0 };
    },
    xpToday: function () {
      var d = Progress.all();
      return d.days[today()] || 0;
    },
    setGoal: function (n) { var d = Progress.all(); d.goal = n; return write(d); },

    reset: function () { write(clone(blank)); },

    LESSONS_PER_UNIT: LESSONS_PER_UNIT,
    QUESTIONS_PER_LESSON: QUESTIONS_PER_LESSON,
    XP_PER_LESSON: XP_PER_LESSON
  };

  /* ---------------- learner profile: age -> syllabus stage ---------------- */
  var STAGES = [
    { id: 'early',     name: 'Early Years',   min: 4,  max: 7,   label: 'Ages 4–7',
      grades: 'Reception–Year 2 · Grades K–2', bands: [1] },
    { id: 'primary',   name: 'Primary',       min: 8,  max: 10,  label: 'Ages 8–10',
      grades: 'Years 3–6 · Grades 3–5', bands: [1] },
    { id: 'middle',    name: 'Middle School', min: 11, max: 13,  label: 'Ages 11–13',
      grades: 'Years 7–9 · Grades 6–8', bands: [1, 2] },
    { id: 'secondary', name: 'Secondary',     min: 14, max: 16,  label: 'Ages 14–16',
      grades: 'GCSE · Grades 9–11', bands: [2, 3] },
    { id: 'advanced',  name: 'Advanced',      min: 17, max: 120, label: 'Ages 17+',
      grades: 'A-level · College', bands: [3] }
  ];

  function stageForAge(age) {
    for (var i = 0; i < STAGES.length; i++) if (age <= STAGES[i].max) return i;
    return STAGES.length - 1;
  }

  var Profile = {
    get: function () {
      try {
        var raw = localStorage.getItem(PROFILE_KEY);
        if (!raw) return null;
        var p = JSON.parse(raw);
        if (typeof p.age !== 'number' || !isFinite(p.age)) return null;
        p.stageIndex = stageForAge(p.age);
        p.stage = STAGES[p.stageIndex];
        return p;
      } catch (e) { return null; }
    },
    set: function (age, name) {
      var p = { age: age, name: name || '', setAt: new Date().toISOString() };
      try { localStorage.setItem(PROFILE_KEY, JSON.stringify(p)); } catch (e) {}
      p.stageIndex = stageForAge(age);
      p.stage = STAGES[p.stageIndex];
      return p;
    },
    clear: function () { try { localStorage.removeItem(PROFILE_KEY); } catch (e) {} },
    stages: STAGES,
    stageForAge: stageForAge
  };

  var Theme = {
    get: function () { try { return localStorage.getItem(THEME_KEY); } catch (e) { return null; } },
    set: function (mode) {
      try { localStorage.setItem(THEME_KEY, mode); } catch (e) {}
      document.documentElement.setAttribute('data-theme', mode);
    },
    init: function () {
      var saved = Theme.get();
      var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', saved || (dark ? 'dark' : 'light'));
    },
    toggle: function () {
      var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      Theme.set(next);
      return next;
    }
  };

  /* ---- shared helpers used by every subject generator ---- */
  var U = {
    int: function (min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; },
    pick: function (arr) { return arr[Math.floor(Math.random() * arr.length)]; },
    shuffle: function (arr) {
      var a = arr.slice();
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    },
    /* Sample n distinct items; reshuffles if the pool is smaller than n. */
    sample: function (arr, n) {
      var out = [];
      if (!arr.length) return out;
      while (out.length < n) {
        var batch = U.shuffle(arr);
        for (var i = 0; i < batch.length && out.length < n; i++) out.push(batch[i]);
      }
      return out;
    },
    /* Choose the bank items that suit a learner's stage.

       Items carry their difficulty band as the last element of the tuple. We take
       everything in the stage's own bands; only if that is too thin do we reach for
       the NEAREST band outwards, one step at a time. Never dump the whole bank —
       that is how a seven-year-old ends up with GCSE questions, and a
       seventeen-year-old with "which animal is a mammal". */
    forStage: function (bank, stageIndex) {
      var stage = STAGES[stageIndex == null ? 2 : stageIndex];
      var want = stage.bands;
      var MIN = 8;

      function bandOf(it) {
        var b = it[it.length - 1];
        return typeof b === 'number' ? b : 2;
      }
      function distance(it) {
        var b = bandOf(it), d = Infinity;
        for (var i = 0; i < want.length; i++) d = Math.min(d, Math.abs(b - want[i]));
        return d;
      }

      var buckets = [];
      bank.forEach(function (it) {
        var d = distance(it);
        (buckets[d] = buckets[d] || []).push(it);
      });

      var out = [];
      for (var d = 0; d < buckets.length && out.length < MIN; d++) {
        if (buckets[d]) out = out.concat(buckets[d]);
      }
      return out.length ? out : bank;
    },

    /* Multiple choice from a correct value plus a pool of distractors. */
    choice: function (prompt, correct, pool, extra) {
      var seen = {}; seen[String(correct)] = true;
      var wrong = [];
      U.shuffle(pool).forEach(function (x) {
        var s = String(x);
        if (seen[s] || s === 'undefined' || s === 'NaN') return;
        seen[s] = true;
        if (wrong.length < 3) wrong.push(s);
      });
      var options = U.shuffle([String(correct)].concat(wrong));
      var q = { type: 'choice', prompt: prompt, choices: options, answer: options.indexOf(String(correct)) };
      if (extra) for (var k in extra) q[k] = extra[k];
      return q;
    },
    /* Numeric distractors that stay plausible next to the real answer. */
    nearby: function (n, spread) {
      spread = spread || Math.max(2, Math.round(Math.abs(n) * 0.2) || 2);
      var set = {}, out = [], guard = 0;
      while (out.length < 6 && guard++ < 60) {
        var d = U.int(-spread, spread);
        if (d === 0 || set[n + d]) continue;
        set[n + d] = true;
        out.push(n + d);
      }
      return out;
    }
  };

  SH.Progress = Progress;
  SH.Profile = Profile;
  SH.STAGES = STAGES;
  SH.Theme = Theme;
  SH.U = U;
  SH.subjects = SH.subjects || [];
  SH.register = function (subject) { SH.subjects.push(subject); };
  SH.subject = function (id) {
    for (var i = 0; i < SH.subjects.length; i++) if (SH.subjects[i].id === id) return SH.subjects[i];
    return null;
  };
})(window.StudyHub);
</script>
<script>
/* Sound effects, synthesised with the Web Audio API.
   No audio files, so the app stays a single self-contained page that works offline. */
(function (SH) {
  'use strict';

  var KEY = 'studyhub.sound';
  var ctx = null;
  var muted = false;

  try { muted = localStorage.getItem(KEY) === 'off'; } catch (e) {}

  /* The context can only start from a user gesture, so it is created on first play. */
  function audio() {
    if (ctx) return ctx;
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return null;
    try { ctx = new Ctor(); } catch (e) { return null; }
    return ctx;
  }

  /* One shaped tone. `to` bends the pitch across the note. */
  function tone(opts) {
    var c = audio();
    if (!c) return;
    if (c.state === 'suspended' && c.resume) c.resume();

    var start = c.currentTime + (opts.delay || 0);
    var dur = opts.dur || 0.12;
    var osc = c.createOscillator();
    var gain = c.createGain();

    osc.type = opts.type || 'sine';
    osc.frequency.setValueAtTime(opts.freq, start);
    if (opts.to) osc.frequency.exponentialRampToValueAtTime(opts.to, start + dur);

    var peak = opts.gain == null ? 0.13 : opts.gain;
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(peak, start + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);

    osc.connect(gain);
    gain.connect(c.destination);
    osc.start(start);
    osc.stop(start + dur + 0.02);
  }

  function play(notes) {
    if (muted) return;
    for (var i = 0; i < notes.length; i++) tone(notes[i]);
  }

  var SOUNDS = {
    tap:      [{ freq: 320, dur: 0.05, type: 'triangle', gain: 0.06 }],
    select:   [{ freq: 520, dur: 0.06, type: 'triangle', gain: 0.07 }],
    correct:  [{ freq: 784, dur: 0.10, type: 'sine', gain: 0.13 },
               { freq: 1175, dur: 0.16, type: 'sine', gain: 0.12, delay: 0.09 }],
    wrong:    [{ freq: 220, to: 120, dur: 0.28, type: 'sawtooth', gain: 0.09 }],
    heart:    [{ freq: 440, to: 180, dur: 0.34, type: 'triangle', gain: 0.10, delay: 0.16 }],
    complete: [{ freq: 523, dur: 0.13, type: 'sine', gain: 0.12 },
               { freq: 659, dur: 0.13, type: 'sine', gain: 0.12, delay: 0.11 },
               { freq: 784, dur: 0.13, type: 'sine', gain: 0.12, delay: 0.22 },
               { freq: 1047, dur: 0.34, type: 'sine', gain: 0.14, delay: 0.33 }],
    crown:    [{ freq: 1047, dur: 0.22, type: 'sine', gain: 0.11 },
               { freq: 1568, dur: 0.34, type: 'sine', gain: 0.09, delay: 0.06 }],
    fail:     [{ freq: 392, dur: 0.18, type: 'triangle', gain: 0.11 },
               { freq: 311, dur: 0.18, type: 'triangle', gain: 0.11, delay: 0.15 },
               { freq: 233, dur: 0.40, type: 'triangle', gain: 0.11, delay: 0.30 }],
    move:     [{ freq: 180, dur: 0.06, type: 'square', gain: 0.05 },
               { freq: 130, dur: 0.05, type: 'square', gain: 0.04, delay: 0.03 }]
  };

  SH.Sfx = {
    play: function (name) {
      var s = SOUNDS[name];
      if (s) play(s);
    },
    muted: function () { return muted; },
    toggle: function () {
      muted = !muted;
      try { localStorage.setItem(KEY, muted ? 'off' : 'on'); } catch (e) {}
      if (!muted) SH.Sfx.play('select');
      return muted;
    }
  };
})(window.StudyHub);
</script>

  function vocabulary(n, stage) {

          explanation: '"' + w[0] + '" (' + w[1] + '): ' + w[2] + '.'
        });
      }
      var words = bank.filter(function (x) { return x[0] !== w[0]; }).map(function (x) { return x[0]; });
      return U.choice('Which word means "' + w[2] + '"?', w[0], words, {

  function bank(items, kicker) {
    return function (n, stage) {
      return U.sample(U.forStage(items, stage), n).map(function (it) {
        var correct = it[1][0];

        prompt: p.ask, choices: opts,
        answer: opts.indexOf(p.options[0]), explanation: p.why

    var correct = p.moves[0][0];
    var choices = U.shuffle(p.moves.map(function (m) { return m[0]; }));
    return {
      type: 'choice', kicker: 'find the move', board: p.fen,
      prompt: p.ask, choices: choices,
      answer: choices.indexOf(correct), explanation: p.why

  function puzzles(n, stage) {

<script>
/* The Coach: works out what specifically went wrong in a question you got wrong,
   then walks you through it — you say what you think your mistake was, it tells you
   whether you're right, then you rewrite the answer and it checks that too.

   This is deterministic analysis, not a language model. It can be this specific
   because it already knows the question, your answer, the right answer and the
   reasoning — so it compares them and recognises the classic error patterns
   (sign slips, order of operations, area vs perimeter, tone errors, doubled
   letters, synonym-for-antonym, and so on). It runs offline with everything else. */
(function (SH) {
  'use strict';

  /* ------------------------------ utilities ------------------------------ */

  function norm(s) {
    return String(s == null ? '' : s).toLowerCase().trim()
      .replace(/[“”"']/g, '').replace(/\s+/g, ' ').replace(/[.,!?;:]+$/, '');
  }

  /* Pull a number out of "$12.50", "48 cm²", "3/4", "25%". */
  function numberOf(text) {
    if (text == null) return null;
    var s = String(text).replace(/[$,\s]/g, '');
    var frac = s.match(/^(-?\d+)\/(\d+)$/);
    if (frac) return +frac[1] / +frac[2];
    var m = s.match(/-?\d+(?:\.\d+)?/);
    if (!m) return null;
    return parseFloat(m[0]);
  }

  function numbersIn(text) {
    var out = [], m, re = /-?\d+(?:\.\d+)?/g;
    while ((m = re.exec(String(text)))) out.push(parseFloat(m[0]));

  }

  function close(a, b) { return a != null && b != null && Math.abs(a - b) < 1e-6; }

  /* Pull a chain like "12 - 4 * 2" out of a prompt and work it out twice:
     once strictly left to right, once respecting precedence. If the learner's
     answer matches the left-to-right value, that IS the mistake. */
  function operatorChain(text) {
    var s = String(text).replace(/×/g, '*').replace(/÷/g, '/').replace(/[−–]/g, '-');
    var m = s.match(/\d+(?:\.\d+)?(?:\s*[-+*\/]\s*\d+(?:\.\d+)?){1,}/);

    var tokens = m[0].replace(/\s+/g, '').match(/\d+(?:\.\d+)?|[-+*\/]/g);
    if (!tokens || tokens.length < 5) return null;      // needs at least two operators

    var l2r = parseFloat(tokens[0]);
    for (i = 1; i < tokens.length; i += 2) l2r = apply(l2r, tokens[i], parseFloat(tokens[i + 1]));

    var pass = [parseFloat(tokens[0])];

      else { pass.push(op); pass.push(rhs); }

    var proper = pass[0];
    for (i = 1; i < pass.length; i += 2) proper = apply(proper, pass[i], pass[i + 1]);

                    'ū':'u','ú':'u','ǔ':'u','ù':'u','ǖ':'ü','ǘ':'ü','ǚ':'ü','ǜ':'ü' };

  }
  function toneNumbers(s) {

  }
  function isPinyin(s) { return /^[a-zA-Züǖǘǚǜāáǎàēéěèīíǐìōóǒòūúǔù' ]+$/.test(String(s)); }
  function hasHanzi(s) { return /[㐀-鿿]/.test(String(s)); }

          cause: 'You multiplied ' + a + ' and ' + b + ' where the question needed you to add them.',
          accept: [['multiply', 'multiplied', 'times', 'add', 'adding', 'plus']],

      return {
        cause: 'The method was not the problem so much as the arithmetic: you answered ' + m.given + ' where the correct value is ' + right + '. Work it through one step at a time.',
        accept: [['arithmetic', 'slip', 'calculation', 'miscalculated', 'careless', 'mental', 'rushed', 'added', 'subtracted', 'multiplied', 'divided', 'misread']],
        hints: ['I made an arithmetic slip', 'I used the wrong formula', 'I misread the question', 'I did the steps in the wrong order']
      };
    }

    return {
      cause: 'You chose "' + m.given + '" where the answer is "' + m.answer + '". ' + (m.explanation || ''),
      accept: [['formula', 'method', 'misread', 'wrong', 'steps', 'order', 'rule']],
      hints: ['I used the wrong method', 'I misread the question', 'I rushed the arithmetic', 'I did not know the rule']
    };
  }

  function diagnoseChinese(m) {
    var given = String(m.given), right = String(m.answer);

    if (isPinyin(given) && isPinyin(right) && stripTones(given) === stripTones(right)) {
      var g = toneNumbers(given), r = toneNumbers(right);
      var where = '';
      for (var i = 0; i < Math.max(g.length, r.length); i++) {
        if (g[i] !== r[i]) { where = ' The tone on syllable ' + (i + 1) + ' should be ' + (r[i] || 'neutral') + ', not ' + (g[i] || 'neutral') + '.'; break; }
      }
      return {
        cause: 'The syllables were right — the tones were not.' + where + ' In Chinese a tone is part of the word, not decoration.',
        accept: [['tone', 'tones', 'accent', 'mark', 'pitch', 'wrong tone']],
        hints: ['I got the tone wrong', 'I picked the wrong syllable', 'I confused it with another word', 'I did not know the word']
      };
    }

    if (hasHanzi(given) && hasHanzi(right)) {
      var shared = sharedChars(given, right);
      if (shared.length) return {
        cause: 'You picked a word that shares the character ' + shared.join('') + ' with the right answer. Sharing a character does not mean sharing a meaning — 电脑, 电视 and 电话 all start with 电.',
        accept: [['similar', 'looks like', 'look alike', 'shares', 'same character', 'confused', 'mixed up', 'similar character', 'looked similar']],
        hints: ['I confused it with a word that looks similar', 'I got the tone wrong', 'I guessed', 'I remembered the wrong meaning']
      };
      return {
        cause: 'You chose ' + given + ' where the answer is ' + right + '. These are different words, so this is recall rather than a slip — worth adding to your flashcards.',
        accept: [['did not know', 'didnt know', 'dont know', 'forgot', 'guess', 'guessed', 'recall', 'remember', 'memor']],
        hints: ['I did not know the word', 'I confused two similar words', 'I got the tone wrong', 'I misread the question']
      };
    }

    return {
      cause: 'You answered "' + given + '" where the answer is "' + right + '". ' + (m.explanation || ''),
      accept: [['tone', 'character', 'meaning', 'forgot', 'guess', 'confused', 'did not know', 'didnt know']],
      hints: ['I did not know it', 'I confused two similar words', 'I got the tone wrong', 'I misread the question']
    };
  }

  function diagnoseEnglish(m) {
    var kicker = norm(m.kicker), prompt = norm(m.prompt);

    if (kicker.indexOf('spelling') !== -1 || prompt.indexOf('spelled') !== -1) {
      return {
        cause: 'Spelling: ' + spellingDiff(m.given, m.answer) + '.',
        accept: [['spell', 'spelling', 'letter', 'letters', 'double', 'missed', 'missing', 'extra', 'typo']],
        hints: ['I spelled it wrong', 'I did not know the word', 'I misread the options', 'I confused it with another word']
      };
    }

    if (prompt.indexOf('opposite') !== -1) {
      return {
        cause: 'The question asked for the opposite, and you gave a word with a similar meaning instead. Read whether it wants a synonym or an antonym before choosing.',
        accept: [['opposite', 'antonym', 'synonym', 'similar', 'misread', 'read the question', 'backwards', 'reversed']],
        hints: ['I gave a similar word instead of an opposite', 'I did not know the word', 'I guessed', 'I misread the options']
      };
    }

    if (kicker.indexOf('sentence') !== -1 || kicker.indexOf('gap') !== -1 || kicker.indexOf('grammar') !== -1) {
      return {
        cause: 'A grammar rule decided this one: ' + (m.explanation || 'the form you chose does not fit the sentence.'),
        accept: [['grammar', 'tense', 'rule', 'agreement', 'plural', 'singular', 'preposition', 'article', 'form', 'verb']],
        hints: ['I did not know the grammar rule', 'It sounded right so I guessed', 'I misread the sentence', 'I confused two similar forms']
      };
    }

    return {
      cause: 'You chose "' + m.given + '" where the answer is "' + m.answer + '". ' + (m.explanation || ''),
      accept: [['meaning', 'definition', 'confused', 'did not know', 'didnt know', 'forgot', 'guess', 'mixed up', 'similar']],
      hints: ['I did not know the word', 'I confused it with a similar word', 'I guessed', 'I misread the question']
    };
  }

  function diagnoseScience(m) {
    return {
      cause: 'You chose "' + m.given + '". ' + (m.explanation || 'The correct answer is "' + m.answer + '".'),
      accept: [['did not know', 'didnt know', 'dont know', 'forgot', 'guess', 'guessed', 'confused', 'mixed up',
                'misread', 'wrong', 'remember', 'misunderstood', 'thought']],
      hints: ['I mixed up two similar ideas', 'I did not know this fact', 'I guessed', 'I misread the question']
    };
  }

  function diagnose(m) {
    var d;
    if (m.subject === 'math') d = diagnoseMath(m);
    else if (m.subject === 'chinese') d = diagnoseChinese(m);
    else if (m.subject === 'english') d = diagnoseEnglish(m);
    else d = diagnoseScience(m);
    d.hints = (d.hints || []).slice(0, 4);
    return d;
  }

  /* Did the learner correctly identify their own mistake? */
  function matchDiagnosis(text, diagnosis) {
    var t = norm(text);
    if (!t) return { ok: false, empty: true };
    if (/^(i (dont|do not|don't) know|no idea|not sure|dunno)$/.test(t)) return { ok: false, unsure: true };

    var groups = diagnosis.accept || [];
    for (var i = 0; i < groups.length; i++) {
      for (var j = 0; j < groups[i].length; j++) {
        if (t.indexOf(groups[i][j]) !== -1) return { ok: true, matched: groups[i][j] };
      }
    }
    return { ok: false };
  }

  /* Did their rewritten answer match? */
  function checkAnswer(text, mistake) {
    var given = norm(text);
    if (!given) return { ok: false, empty: true };
    var right = norm(mistake.answer);
    if (given === right) return { ok: true };

    var a = numberOf(text), b = numberOf(mistake.answer);
    if (a != null && b != null && close(a, b)) return { ok: true, loose: 'the number is right' };

    // allow the answer with or without units, and "the" / "a" in front
    var stripped = given.replace(/^(the|a|an)\s+/, '').replace(/[^a-z0-9㐀-鿿\/=+\-.]/g, '');
    var rightStripped = right.replace(/^(the|a|an)\s+/, '').replace(/[^a-z0-9㐀-鿿\/=+\-.]/g, '');
    if (stripped && stripped === rightStripped) return { ok: true, loose: 'wording differs slightly' };

    if (given === norm(mistake.given)) return { ok: false, repeated: true };
    return { ok: false };
  }

  SH.Coach = {
    diagnose: diagnose,
    matchDiagnosis: matchDiagnosis,
    checkAnswer: checkAnswer,
    norm: norm,
    numberOf: numberOf,
    spellingDiff: spellingDiff
  };
})(window.StudyHub);
</script>
<script>
/* The lesson runner: one screen at a time, hearts, check-then-continue. */
(function (SH) {
  'use strict';

  var LETTERS = ['1', '2', '3', '4', '5', '6'];

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function normalise(s) {
    return String(s).trim().toLowerCase().replace(/\s+/g, ' ').replace(/[.,!?;:]+$/, '');
  }
  function isCjk(s) { return /[㐀-鿿]/.test(s); }
  function sfx(name) { if (SH.Sfx) SH.Sfx.play(name); }

  /* Draw a position from a FEN string. Filled glyphs are used for both sides and
     coloured with CSS, because outline glyphs render inconsistently across fonts. */
  var PIECE_NAME = { k: 'king', q: 'queen', r: 'rook', b: 'bishop', n: 'knight', p: 'pawn' };

  function renderBoard(fen) {
    var rows = fen.split(' ')[0].split('/');
    var wrap = el('div', 'board-wrap');
    var grid = el('div', 'board');

    for (var r = 0; r < 8; r++) {
      var file = 0;
      var chars = rows[r].split('');
      for (var c = 0; c < chars.length; c++) {
        var ch = chars[c];
        if (/\d/.test(ch)) {
          for (var k = 0; k < +ch; k++) { grid.appendChild(square(file, r, null)); file++; }
        } else {
          grid.appendChild(square(file, r, ch));
          file++;
        }
      }
    }

    function square(fileIndex, rowIndex, piece) {
      var dark = (fileIndex + rowIndex) % 2 === 1;
      var cell = el('div', 'sq ' + (dark ? 'dark' : 'light'));
      if (piece) {
        var white = piece === piece.toUpperCase();
        var kind = piece.toLowerCase();
        var span = el('span', 'piece');
        span.innerHTML = SH.ChessPieces.svg(piece);
        span.setAttribute('role', 'img');
        span.setAttribute('aria-label', (white ? 'white ' : 'black ') + PIECE_NAME[kind] +
          ' on ' + 'abcdefgh'.charAt(fileIndex) + (8 - rowIndex));
        cell.appendChild(span);
      }
      // coordinates sit in the corner of the edge squares, as on a real board
      if (fileIndex === 0) cell.appendChild(el('span', 'coord rank', String(8 - rowIndex)));
      if (rowIndex === 7) cell.appendChild(el('span', 'coord file', 'abcdefgh'.charAt(fileIndex)));
      return cell;
    }

    wrap.appendChild(grid);
    return wrap;
  }

  /* opts: { subject, topic, lesson, stage, mode: 'lesson' | 'practice', onExit } */
  function Lesson(root, opts) {
    this.root = root;
    this.subject = opts.subject;
    this.topic = opts.topic;
    this.lessonIndex = opts.lesson;
    this.stage = opts.stage;
    this.mode = opts.mode || 'lesson';
    this.onExit = opts.onExit;

    this.count = SH.Progress.QUESTIONS_PER_LESSON;
    this.questions = this.topic.generate(this.count, this.stage);
    this.index = 0;
    this.correct = 0;
    this.log = [];
    this.picked = null;
    this.typed = '';
    this.checked = false;
    this.finished = false;

    this.onKey = this.handleKey.bind(this);
    document.addEventListener('keydown', this.onKey);
  }

  Lesson.prototype.detach = function () { document.removeEventListener('keydown', this.onKey); };

  Lesson.prototype.handleKey = function (e) {
    if (this.finished || !document.body.contains(this.root)) return;
    if (e.key === 'Enter') {
      e.preventDefault();
      if (this.checked) this.advance();
      else if (this.picked != null || this.typed) this.check();
      return;
    }
    var q = this.questions[this.index];
    if (!q || q.type !== 'choice' || this.checked) return;
    var i = LETTERS.indexOf(e.key);
    if (i >= 0 && i < q.choices.length) {
      e.preventDefault();
      this.picked = i;
      this.draw();
    }
  };

  Lesson.prototype.check = function () {
    if (this.checked) return;
    var q = this.questions[this.index];
    var right;
    if (q.type === 'input') {
      var accepted = (q.accept || [q.answer]).map(normalise);
      right = accepted.indexOf(normalise(this.typed)) !== -1;
      this.log.push({ prompt: q.prompt, given: this.typed || '(blank)', answer: q.answer, ok: right });
    } else {
      if (this.picked == null) return;
      right = this.picked === q.answer;
      this.log.push({ prompt: q.prompt, given: q.choices[this.picked], answer: q.choices[q.answer], ok: right });
    }
    this.checked = true;
    this.lastOk = right;
    if (right) {
      this.correct++;
      sfx('correct');
    } else {
      sfx('wrong');
      if (this.mode === 'lesson') {
        this.hearts = SH.Progress.loseHeart();
        sfx('heart');
      }
      this.recordMistake(q, right);
    }
    this.draw();
  };

  /* Wrong answers are kept so the Coach can walk you back through them.
     Chess is left out: its questions are positions, not written answers. */
  Lesson.prototype.recordMistake = function (q, wasRight) {
    if (wasRight || this.subject.id === 'chess') return;
    var entry = this.log[this.log.length - 1];
    if (!entry) return;
    SH.Progress.logMistake({
      subject: this.subject.id, subjectName: this.subject.name, emoji: this.subject.emoji,
      topic: this.topic.id, topicName: this.topic.name,
      kicker: q.kicker || '', prompt: q.prompt, passage: q.passage || '',
      given: entry.given, answer: entry.answer, explanation: q.explanation || ''
    });
  };

  Lesson.prototype.advance = function () {
    if (this.mode === 'lesson' && SH.Progress.hearts() <= 0) return this.outOfHearts();
    this.index++;
    this.picked = null;
    this.typed = '';
    this.checked = false;
    if (this.index >= this.questions.length) return this.finish();
    this.draw();
  };

  Lesson.prototype.finish = function () {
    this.finished = true;
    this.detach();
    var pct = Math.round((this.correct / this.questions.length) * 100);
    var passed = this.correct >= Math.ceil(this.questions.length * 0.6);
    var xp = this.mode === 'practice' ? 5 : SH.Progress.XP_PER_LESSON + (pct === 100 ? 5 : 0);

    SH.Progress.finishLesson({
      subject: this.subject.id, topic: this.topic.id, lesson: this.lessonIndex,
      correct: this.correct, asked: this.questions.length, passed: passed, xp: xp
    });
    if (this.mode === 'practice') SH.Progress.gainHeart();

    sfx(passed ? (pct === 100 ? 'crown' : 'complete') : 'fail');
    this.renderResult(pct, passed, this.mode === 'practice' ? 5 : (passed ? xp : 0));
  };

  Lesson.prototype.outOfHearts = function () {
    this.finished = true;
    this.detach();
    sfx('fail');
    var self = this;
    SH.Progress.finishLesson({
      subject: this.subject.id, topic: this.topic.id, lesson: this.lessonIndex,
      correct: this.correct, asked: this.index + 1, passed: false, xp: 0
    });

    this.root.innerHTML = '';
    var box = el('div', 'result');
    box.appendChild(el('div', 'mascot', '💔'));
    box.appendChild(el('h1', null, 'You ran out of hearts'));
    box.appendChild(el('p', 'subline', 'Hearts come back over time — one every 20 minutes. Practice a finished lesson to earn one back straight away.'));
    var again = el('button', 'btn btn--wide', 'Back to the path');
    again.type = 'button';
    again.onclick = function () { self.onExit(); };
    var refill = el('button', 'btn btn--ghost btn--wide', 'Refill hearts now');
    refill.type = 'button';
    refill.style.marginTop = '10px';
    refill.onclick = function () { SH.Progress.refillHearts(); self.onExit(); };
    box.appendChild(again);
    box.appendChild(refill);
    this.root.appendChild(box);
  };

  Lesson.prototype.renderResult = function (pct, passed, xp) {
    var self = this;
    this.root.innerHTML = '';
    var box = el('div', 'result');
    box.appendChild(el('div', 'mascot', pct === 100 ? '🏆' : passed ? '🎉' : '💪'));
    box.appendChild(el('h1', null, pct === 100 ? 'Flawless!' : passed ? 'Lesson complete!' : 'Keep going!'));
    box.appendChild(el('p', 'subline',
      this.subject.name + ' · ' + this.topic.name + (passed ? '' : ' — get 60% to unlock the next lesson')));

    var tally = el('div', 'tally');
    [['green', 'Total XP', '+' + xp], ['blue', 'Accuracy', pct + '%'], ['', 'Correct', this.correct + '/' + this.questions.length]]
      .forEach(function (t) {
        var b = el('div', 'tally-box' + (t[0] ? ' ' + t[0] : ''));
        b.appendChild(el('div', 'tally-label', t[1]));
        b.appendChild(el('div', 'tally-value', t[2]));
        tally.appendChild(b);
      });
    box.appendChild(tally);

    var misses = this.log.filter(function (l) { return !l.ok; });
    if (misses.length) {
      var review = el('div', 'review');
      review.appendChild(el('div', 'kicker', 'Worth another look'));
      misses.forEach(function (m) {
        var row = el('div', 'review-item miss');
        row.appendChild(el('div', null, m.prompt));
        row.appendChild(el('div', 'r-a', 'You said "' + m.given + '" · answer: ' + m.answer));
        review.appendChild(row);
      });
      box.appendChild(review);
    }

    var cont = el('button', 'btn btn--wide', 'Continue');
    cont.type = 'button';
    cont.onclick = function () { self.onExit(); };
    box.appendChild(cont);

    var again = el('button', 'btn btn--ghost btn--wide', 'Practise again');
    again.type = 'button';
    again.style.marginTop = '10px';
    again.onclick = function () {
      SH.startLesson(self.root, {
        subject: self.subject, topic: self.topic, lesson: self.lessonIndex,
        stage: self.stage, mode: self.mode, onExit: self.onExit
      });
    };
    box.appendChild(again);

    this.root.appendChild(box);
    window.scrollTo(0, 0);
  };

  Lesson.prototype.draw = function () {
    var self = this;
    var q = this.questions[this.index];
    this.root.innerHTML = '';

    /* --- top bar: quit, progress, hearts --- */
    var top = el('div', 'lesson-top');
    var quit = el('button', 'close-x', '✕');
    quit.type = 'button';
    quit.title = 'Quit lesson';
    quit.onclick = function () { self.detach(); self.onExit(); };
    top.appendChild(quit);

    var track = el('div', 'track');
    track.style.flex = '1';
    var fill = el('i');
    fill.style.width = Math.round((this.index / this.questions.length) * 100) + '%';
    track.appendChild(fill);
    top.appendChild(track);

    if (this.mode === 'lesson') {
      top.appendChild(el('span', 'stat-pill heart', '❤️ ' + SH.Progress.hearts()));
    } else {
      top.appendChild(el('span', 'stat-pill dim', '∞'));
    }
    this.root.appendChild(top);

    /* --- question --- */
    var body = el('div', 'lesson-body');
    body.appendChild(el('div', 'kicker', q.kicker || this.topic.name));
    if (q.board) body.appendChild(renderBoard(q.board));
    if (q.passage) body.appendChild(el('div', 'passage', q.passage));

    var promptCls = 'prompt' + (q.promptBig ? ' big' : '') + (isCjk(q.prompt) && q.promptBig ? ' script' : '');
    body.appendChild(el('h2', promptCls, q.prompt));

    if (q.type === 'input') {
      var input = el('input', 'type-answer');
      input.type = 'text';
      input.autocomplete = 'off';
      input.placeholder = 'Type your answer';
      input.value = this.typed;
      input.disabled = this.checked;
      input.oninput = function () { self.typed = input.value; self.syncCheckButton(); };
      body.appendChild(input);
      if (!this.checked) setTimeout(function () { input.focus(); }, 0);
    } else {
      var options = el('div', 'options');
      q.choices.forEach(function (text, i) {
        var b = el('button', 'option');
        b.type = 'button';
        if (self.checked) {
          b.disabled = true;
          if (i === q.answer) b.className = 'option right';
          else if (i === self.picked) b.className = 'option wrong';
        } else if (self.picked === i) {
          b.className = 'option sel';
        }
        b.appendChild(el('span', 'key', LETTERS[i]));
        b.appendChild(el('span', null, text));
        b.onclick = function () { self.picked = i; sfx('select'); self.draw(); };
        options.appendChild(b);
      });
      body.appendChild(options);
    }
    this.root.appendChild(body);

    /* --- bottom bar --- */
    var bar = el('div', 'footbar' + (this.checked ? (this.lastOk ? ' ok' : ' no') : ''));
    var inner = el('div', 'footbar-inner');

    if (this.checked) {
      var verdict = el('div', 'verdict');
      var head = el('div', 'headline');
      head.appendChild(el('span', null, this.lastOk ? '✓' : '✕'));
      head.appendChild(el('span', null, this.lastOk ? 'Nicely done!' : 'Correct answer: ' +
        (q.type === 'input' ? q.answer : q.choices[q.answer])));
      verdict.appendChild(head);
      if (q.explanation) verdict.appendChild(el('div', 'why', q.explanation));
      inner.appendChild(verdict);

      var cont = el('button', 'btn' + (this.lastOk ? '' : ' btn--red'),
        this.index + 1 >= this.questions.length ? 'Finish' : 'Continue');
      cont.type = 'button';
      cont.onclick = function () { self.advance(); };
      inner.appendChild(cont);
      setTimeout(function () { cont.focus(); }, 0);
    } else {
      inner.appendChild(el('div', 'verdict small muted',
        q.type === 'input' ? 'Type your answer, then press Enter' : 'Pick an answer — or press 1–' + q.choices.length));
      var checkBtn = el('button', 'btn', 'Check');
      checkBtn.type = 'button';
      checkBtn.disabled = q.type === 'input' ? !this.typed : this.picked == null;
      checkBtn.onclick = function () { self.check(); };
      this.checkBtn = checkBtn;
      inner.appendChild(checkBtn);
    }

    bar.appendChild(inner);
    this.root.appendChild(bar);
  };

  Lesson.prototype.syncCheckButton = function () {
    if (this.checkBtn) this.checkBtn.disabled = !this.typed;
  };

  SH.startLesson = function (root, opts) {
    var l = new Lesson(root, opts);
    l.draw();
    window.scrollTo(0, 0);
    return l;
  };

  /* ---------------- flashcards ---------------- */
  SH.renderFlashcards = function (root, subject, topic, stage, onExit) {
    var cards = SH.U.shuffle(topic.flashcards(stage));
    var i = 0, flipped = false;

    function draw() {
      root.innerHTML = '';
      var top = el('div', 'lesson-top');
      var quit = el('button', 'close-x', '✕');
      quit.type = 'button';
      quit.onclick = function () { document.removeEventListener('keydown', keys); onExit(); };
      top.appendChild(quit);
      var track = el('div', 'track');
      track.style.flex = '1';
      var fill = el('i');
      fill.style.width = Math.round(((i + 1) / cards.length) * 100) + '%';
      track.appendChild(fill);
      top.appendChild(track);
      top.appendChild(el('span', 'stat-pill dim', (i + 1) + '/' + cards.length));
      root.appendChild(top);

      var c = cards[i];
      var body = el('div', 'lesson-body center');
      body.appendChild(el('div', 'kicker', subject.name + ' · ' + topic.name));
      var face = el('h2', 'prompt big' + (isCjk(c.front) ? ' script' : ''), c.front);
      face.style.cursor = 'pointer';
      face.onclick = function () { flipped = !flipped; sfx('tap'); draw(); };
      body.appendChild(face);
      if (flipped) {
        body.appendChild(el('div', 'prompt', c.back));
        if (c.sub) body.appendChild(el('div', 'muted', c.sub));
      } else {
        body.appendChild(el('div', 'muted', 'Tap the card or press Space to reveal'));
      }
      root.appendChild(body);

      var bar = el('div', 'footbar');
      var inner = el('div', 'footbar-inner');
      var prev = el('button', 'btn btn--ghost', 'Back');
      prev.type = 'button';
      prev.onclick = function () { i = (i - 1 + cards.length) % cards.length; flipped = false; draw(); };
      var flip = el('button', 'btn btn--blue', flipped ? 'Hide' : 'Reveal');
      flip.type = 'button';
      flip.onclick = function () { flipped = !flipped; sfx('tap'); draw(); };
      var next = el('button', 'btn', 'Next');
      next.type = 'button';
      next.onclick = function () { i = (i + 1) % cards.length; flipped = false; draw(); };
      inner.appendChild(prev);
      inner.appendChild(flip);
      inner.appendChild(next);
      bar.appendChild(inner);
      root.appendChild(bar);
    }

    function keys(e) {
      if (!document.body.contains(root)) { document.removeEventListener('keydown', keys); return; }
      if (e.key === 'ArrowRight') { i = (i + 1) % cards.length; flipped = false; draw(); }
      else if (e.key === 'ArrowLeft') { i = (i - 1 + cards.length) % cards.length; flipped = false; draw(); }
      else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flipped = !flipped; draw(); }
    }
    document.addEventListener('keydown', keys);
    draw();
    window.scrollTo(0, 0);
  };
})(window.StudyHub);

<script>
/* Play a game against the bot: pick a strength, pick a colour, then move by

(function (SH) {
  'use strict';

  var Chess = SH.Chess;
  var AI = SH.ChessAI;

  var Pieces = SH.ChessPieces;
  var NAME = { k: 'king', q: 'queen', r: 'rook', b: 'bishop', n: 'knight', p: 'pawn' };
  var ANIM_MS = 190;
  var PREF_KEY = 'studyhub.chess.elo';

  function el(tag, cls, text) {

  }
  function btn(cls, text, onClick) {
    var b = el('button', cls, text);
    b.type = 'button';
    b.onclick = onClick;
    return b;
  }
  function sfx(name) { if (SH.Sfx) SH.Sfx.play(name); }

  /* ---------------------------- strength picker ---------------------------- */

  function renderPicker(root, onExit) {
    root.innerHTML = '';
    var saved = null;
    try { saved = +localStorage.getItem(PREF_KEY) || null; } catch (e) {}

    var top = el('div', 'lesson-top');
    top.appendChild(btn('close-x', '✕', onExit));
    top.appendChild(el('div', 'quiz-count', 'Play chess'));
    top.appendChild(el('div', 'hud-spacer'));
    root.appendChild(top);

    var wrap = el('div', 'wrap');
    wrap.appendChild(el('div', 'mascot center', '♟️'));
    wrap.appendChild(el('h1', 'center', 'Choose your opponent'));
    wrap.appendChild(el('p', 'muted center', 'Ratings are a rough guide to strength, not official Elo.'));

    var chosen = { elo: saved || 800, color: 'w' };

    var list = el('div', 'rows');
    list.style.marginTop = '18px';
    AI.LEVELS.forEach(function (level) {
      var tile = el('button', 'tile' + (level.elo === chosen.elo ? ' sel' : ''));
      tile.type = 'button';
      tile.appendChild(el('span', 'emoji', level.elo >= 2000 ? '🤖' : level.elo >= 1600 ? '🤓' : level.elo >= 1200 ? '😎' : level.elo >= 800 ? '🙂' : '🐣'));
      var body = el('div');
      body.appendChild(el('div', null, '≈' + level.elo + '  ·  ' + level.name));
      body.appendChild(el('span', 'tile-sub', level.blurb));
      tile.appendChild(body);
      tile.onclick = function () {
        chosen.elo = level.elo;
        sfx('select');
        try { localStorage.setItem(PREF_KEY, String(level.elo)); } catch (e) {}
        renderPickerState();
      };
      list.appendChild(tile);
    });
    wrap.appendChild(list);

    wrap.appendChild(el('h2', 'section-head', ''));
    wrap.lastChild.appendChild(el('h2', null, 'Play as'));

    var sides = el('div', 'age-grid');
    sides.style.marginTop = '0';
    [['w', 'White', '♔', 'You move first'],
     ['b', 'Black', '♚', 'The bot moves first'],
     ['?', 'Random', '🎲', 'Decided by coin flip']].forEach(function (opt) {
      var t = el('button', 'tile');
      t.type = 'button';
      t.dataset.side = opt[0];
      t.appendChild(el('span', 'emoji', opt[2]));
      var body = el('div');
      body.appendChild(el('div', null, opt[1]));
      body.appendChild(el('span', 'tile-sub', opt[3]));
      t.appendChild(body);
      t.onclick = function () { chosen.color = opt[0]; sfx('select'); renderPickerState(); };
      sides.appendChild(t);
    });
    wrap.appendChild(sides);

    var start = btn('btn btn--wide', 'Start game', function () {
      var color = chosen.color === '?' ? (Math.random() < 0.5 ? 'w' : 'b') : chosen.color;
      startGame(root, chosen.elo, color, onExit);
    });
    start.style.marginTop = '20px';
    wrap.appendChild(start);
    root.appendChild(wrap);

    function renderPickerState() {
      list.querySelectorAll('.tile').forEach(function (t, i) {
        t.className = 'tile' + (AI.LEVELS[i].elo === chosen.elo ? ' sel' : '');
      });
      sides.querySelectorAll('.tile').forEach(function (t) {
        t.className = 'tile' + (t.dataset.side === chosen.color ? ' sel' : '');
      });
    }
    renderPickerState();
    window.scrollTo(0, 0);
  }

  /* --------------------------------- game --------------------------------- */

  function startGame(root, elo, playerColor, onExit) {
    var game = {
      state: Chess.createGame(),
      elo: elo,
      level: AI.levelFor(elo),
      player: playerColor,
      history: [],          // { move, undo, san }
      selected: -1,
      targets: [],
      lastMove: null,
      thinking: false,
      over: false,
      result: null,
      resultDetail: '',
      awarded: false,
      promo: null,          // { from, to, options } while the picker is open
      premove: null,        // { from, to } queued while the bot thinks
      anim: null            // { from, to, rookFrom, rookTo } to animate on the next draw
    };

    function botColor() { return game.player === 'w' ? 'b' : 'w'; }

    function finishIfOver() {
      var s = Chess.status(game.state);
      if (s === 'ongoing') return false;
      game.over = true;
      if (s === 'checkmate') {
        var loser = game.state.turn;
        game.result = loser === game.player ? 'loss' : 'win';
        game.resultDetail = 'Checkmate';
      } else {
        game.result = 'draw';
        game.resultDetail = {
          'stalemate': 'Stalemate',
          'fifty-move': 'Draw by the fifty-move rule',
          'repetition': 'Draw by threefold repetition',
          'insufficient-material': 'Draw — not enough material to mate'
        }[s] || 'Draw';
      }
      award();
      sfx(game.result === 'win' ? 'complete' : game.result === 'draw' ? 'select' : 'fail');
      return true;
    }

    /* A finished game is worth XP, the way a finished lesson is. */
    function award() {
      if (game.awarded) return;
      game.awarded = true;
      var xp = game.result === 'win' ? 25 : game.result === 'draw' ? 12 : 5;
      SH.Progress.addXp(xp, Math.max(1, Math.round(game.history.length / 2)));
      game.xpEarned = xp;
    }

    function applyMove(move) {
      var text = Chess.san(game.state, move);
      game.anim = { from: move.from, to: move.to };
      if (move.castle) {
        var white = Chess.colorOf(move.piece) === 'w';
        game.anim.rookFrom = move.castle === 'K' ? (white ? 7 : 63) : (white ? 0 : 56);
        game.anim.rookTo = move.castle === 'K' ? move.to - 1 : move.to + 1;
      }
      var undo = Chess.make(game.state, move);
      game.history.push({ move: move, undo: undo, san: text });
      game.lastMove = { from: move.from, to: move.to };
      game.selected = -1;
      game.targets = [];
      if (move.captured) sfx('wrong'); else sfx('move');
      if (Chess.inCheck(game.state, game.state.turn)) sfx('select');
      return text;
    }

    function botMove() {
      if (game.over) return;
      game.thinking = true;
      draw();
      /* The search yields between slices, so the board stays clickable and a
         premove can be queued while the bot is still working. */
      AI.chooseMoveAsync(game.state, game.elo, function (choice) {
        if (game.over) return;
        game.thinking = false;
        if (!choice) { finishIfOver(); draw(); return; }
        applyMove(choice.move);
        if (finishIfOver()) { draw(); return; }
        draw();          // paint the bot's move, and animate it
        runPremove();    // then release any premove, which draws again itself
      });
    }

    /* A premove was queued while the bot was thinking. Play it if it is still
       legal now that the position has changed, and quietly drop it if not. */
    function runPremove() {
      var queued = game.premove;
      game.premove = null;
      if (!queued || game.over) return;
      var legal = Chess.legalMoves(game.state).filter(function (m) {
        return m.from === queued.from && m.to === queued.to;
      });
      if (!legal.length) { sfx('tap'); return; }
      if (legal.length > 1 && legal[0].promo) {   // a premoved promotion always queens
        var queen = legal.filter(function (m) { return String(m.promo).toLowerCase() === 'q'; })[0];
        applyMove(queen || legal[0]);
      } else {
        applyMove(legal[0]);
      }
      if (finishIfOver()) draw();
      else botMove();
    }

    function playerMove(from, to) {
      var legal = Chess.legalMoves(game.state).filter(function (m) {
        return m.from === from && m.to === to;
      });
      if (!legal.length) return;

      if (legal.length > 1 && legal[0].promo) {     // promotion: ask which piece
        game.promo = { from: from, to: to, options: legal };
        draw();
        return;
      }
      applyMove(legal[0]);
      // botMove draws once it has flagged itself as thinking; drawing again here
      // would rebuild the board underneath the animation we just scheduled
      if (finishIfOver()) draw();
      else botMove();
    }

    /* Where a piece could go if it were our turn. Used for premoves, so it
       deliberately ignores whatever the opponent is about to do. */
    function premoveTargets(sq) {
      return Chess.pseudoMoves(game.state, game.player)
        .filter(function (m) { return m.from === sq; })
        .map(function (m) { return m.to; });
    }

    function selectSquare(sq) {
      if (game.over || game.promo) return;
      var piece = game.state.board[sq];
      var mine = piece !== 0 && Chess.colorOf(piece) === game.player;

      // the bot is thinking: anything we do here queues a premove
      if (game.state.turn !== game.player) {
        if (game.selected >= 0 && game.targets.indexOf(sq) !== -1) {
          game.premove = { from: game.selected, to: sq };
          game.selected = -1;
          game.targets = [];
          sfx('select');
        } else if (mine) {
          game.premove = null;
          game.selected = sq;
          game.targets = premoveTargets(sq);
          sfx('tap');
        } else {
          game.selected = -1;
          game.targets = [];
          game.premove = null;
        }
        draw();
        return;
      }

      if (game.selected >= 0 && game.targets.indexOf(sq) !== -1) {
        playerMove(game.selected, sq);
        return;
      }
      if (mine) {
        game.selected = sq;
        game.targets = Chess.legalMoves(game.state)
          .filter(function (m) { return m.from === sq; })
          .map(function (m) { return m.to; });
        sfx('tap');
      } else {
        game.selected = -1;
        game.targets = [];
      }
      draw();
    }

    function undoMove() {
      if (game.thinking) return;
      // take back to the player's own turn again
      var steps = 0;
      while (game.history.length && steps < 2) {
        var last = game.history.pop();
        Chess.unmake(game.state, last.move, last.undo);
        steps++;
        if (game.state.turn === game.player) break;
      }
      game.over = false;
      game.result = null;
      game.awarded = false;
      game.selected = -1;
      game.targets = [];
      game.premove = null;
      game.anim = null;
      var prev = game.history[game.history.length - 1];
      game.lastMove = prev ? { from: prev.move.from, to: prev.move.to } : null;
      sfx('tap');
      draw();
    }

    function resign() {
      if (game.over) return;
      game.over = true;
      game.result = 'loss';
      game.resultDetail = 'You resigned';
      award();
      sfx('fail');
      draw();
    }

    /* ------------------------------ rendering ------------------------------ */

    function materialEdge() {
      var score = { w: 0, b: 0 };
      for (var sq = 0; sq < 64; sq++) {
        var p = game.state.board[sq];
        if (p === 0) continue;
        var k = p.toLowerCase();
        if (k === 'k') continue;
        score[Chess.isWhitePiece(p) ? 'w' : 'b'] += AI.VALUE[k];
      }
      return Math.round((score[game.player] - score[botColor()]) / 100);
    }

    function drawBoard() {
      var wrap = el('div', 'board-wrap');
      var cells = {};
      var grid = el('div', 'board board--play');
      var flipped = game.player === 'b';
      var kingInCheck = Chess.inCheck(game.state, game.state.turn)
        ? Chess.findKing(game.state, game.state.turn) : -1;

      for (var row = 0; row < 8; row++) {
        for (var col = 0; col < 8; col++) {
          var rank = flipped ? row : 7 - row;
          var file = flipped ? 7 - col : col;
          var sq = rank * 8 + file;
          var dark = (file + rank) % 2 === 0;
          var cell = el('button', 'sq ' + (dark ? 'dark' : 'light'));
          cell.type = 'button';
          cell.setAttribute('aria-label', Chess.sqName(sq));

          if (game.lastMove && (sq === game.lastMove.from || sq === game.lastMove.to)) cell.classList.add('last');
          if (game.premove && (sq === game.premove.from || sq === game.premove.to)) cell.classList.add('premove');
          if (sq === game.selected) cell.classList.add('sel');
          if (sq === kingInCheck) cell.classList.add('check');

          var piece = game.state.board[sq];
          if (piece !== 0) {
            var white = Chess.isWhitePiece(piece);
            var kind = piece.toLowerCase();
            var span = el('span', 'piece');
            span.innerHTML = Pieces.svg(piece);
            span.setAttribute('role', 'img');
            span.setAttribute('aria-label', (white ? 'white ' : 'black ') + NAME[kind]);
            span.dataset.sq = sq;
            cell.appendChild(span);

          if (game.targets.indexOf(sq) !== -1) {
            cell.appendChild(el('span', piece !== 0 ? 'target take' : 'target'));
          }
          if (col === 0) cell.appendChild(el('span', 'coord rank', String(rank + 1)));
          if (row === 7) cell.appendChild(el('span', 'coord file', 'abcdefgh'.charAt(file)));

          cells[sq] = cell;
          (function (square) { cell.onclick = function () { selectSquare(square); }; })(sq);
          grid.appendChild(cell);
        }
