<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StudyHub — English · Math · Science · Chinese</title>
<meta name="description" content="Bite-sized lessons in English, Math, Science and Chinese, matched to your age and school year.">
<style>
/* ============================================================
   StudyHub — a lesson-path study app for English, Math,
   Science and Chinese. Chunky, playful, keyboard friendly.
   ============================================================ */

:root {
  --green: #58cc02;
  --green-dark: #46a302;
  --green-tint: #d7ffb8;
  --blue: #1cb0f6;
  --blue-dark: #1899d6;
  --blue-tint: #ddf4ff;
  --red: #ff4b4b;
  --red-dark: #ea2b2b;
  --red-tint: #ffdfe0;
  --yellow: #ffc800;
  --yellow-dark: #e6a400;
  --orange: #ff9600;
  --purple: #ce82ff;

  --bg: #ffffff;
  --card: #ffffff;
  --sunk: #f7f7f7;
  --line: #e5e5e5;
  --line-strong: #d4d4d4;
  --text: #3c3c3c;
  --text-dim: #afafaf;

  --english: #1cb0f6;
  --math: #ff9600;
  --science: #58cc02;
  --chinese: #ff4b4b;

  --radius: 16px;
  /* system rounded stack: no network fetch, so the app works fully offline */
  --font: ui-rounded, "SF Pro Rounded", "Segoe UI Variable Display", "Segoe UI",
          system-ui, -apple-system, Roboto, "Noto Sans SC", "PingFang SC",
          "Microsoft YaHei", sans-serif;
}

:root[data-theme="dark"] {
  --bg: #131f24;
  --card: #1b2b32;
  --sunk: #202f36;
  --line: #37464f;
  --line-strong: #46565f;
  --text: #f1f7fb;
  --text-dim: #7f97a3;
  --green-tint: #202f1a;
  --red-tint: #331c1f;
  --blue-tint: #17323f;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  font-weight: 700;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3 { margin: 0; font-weight: 800; letter-spacing: -.02em; }
button { font-family: inherit; }

/* ---------------- chunky buttons ---------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 0; border-radius: var(--radius);
  padding: 14px 22px; min-height: 50px;
  font-size: .95rem; font-weight: 800; letter-spacing: .8px; text-transform: uppercase;
  color: #fff; background: var(--green);
  box-shadow: 0 4px 0 var(--green-dark);
  cursor: pointer; user-select: none;
  transition: filter .1s ease;
}
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(4px); box-shadow: none; }
.btn--blue { background: var(--blue); box-shadow: 0 4px 0 var(--blue-dark); }
.btn--red { background: var(--red); box-shadow: 0 4px 0 var(--red-dark); }
.btn--ghost {
  background: transparent; color: var(--text-dim);
  border: 2px solid var(--line); border-bottom-width: 4px; box-shadow: none;
}
.btn--ghost:active { transform: translateY(2px); border-bottom-width: 2px; }
.btn[disabled] {
  background: var(--line); color: var(--text-dim); box-shadow: none;
  cursor: not-allowed; filter: none;
}
.btn[disabled]:active { transform: none; }
.btn--wide { width: 100%; }

.link {
  background: none; border: 0; padding: 0; cursor: pointer;
  color: var(--blue); font-weight: 800; font-size: .88rem;
  text-transform: uppercase; letter-spacing: .6px;
}
.link:hover { filter: brightness(1.1); }

/* ---------------- top HUD ---------------- */
.hud {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 10px;
  padding: 12px 18px;
  background: var(--bg);
  border-bottom: 2px solid var(--line);
}
.hud .brand {
  display: flex; align-items: center; gap: 8px;
  background: none; border: 0; cursor: pointer; padding: 0;
  color: var(--green); font-size: 1.15rem; font-weight: 800; letter-spacing: -.02em;
}
.hud-spacer { flex: 1; }
.stat-pill {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 1rem; font-weight: 800; color: var(--text-dim);
  background: none; border: 0; padding: 4px 6px; border-radius: 10px; cursor: default;
}
.stat-pill.fire { color: var(--orange); }
.stat-pill.gem { color: var(--blue); }
.stat-pill.heart { color: var(--red); }
.stat-pill.dim { color: var(--text-dim); }
.icon-btn {
  background: none; border: 0; cursor: pointer; font-size: 1.1rem;
  padding: 6px 8px; border-radius: 10px; color: var(--text-dim);
}
.icon-btn:hover { background: var(--sunk); }

/* ---------------- layout ---------------- */
.wrap { max-width: 640px; margin: 0 auto; padding: 22px 18px 90px; }
.wrap--wide { max-width: 860px; }
.center { text-align: center; }
.muted { color: var(--text-dim); font-weight: 700; }
.small { font-size: .85rem; }

/* ---------------- onboarding ---------------- */
.onboard {
  min-height: calc(100vh - 0px);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 40px 20px 60px; gap: 8px; text-align: center;
}
.mascot { font-size: 4.5rem; line-height: 1; margin-bottom: 6px; }
.onboard h1 { font-size: 1.7rem; margin-bottom: 6px; }
.onboard p { color: var(--text-dim); margin: 0 0 24px; max-width: 420px; }
.speech {
  position: relative; background: var(--sunk); border: 2px solid var(--line);
  border-radius: 14px; padding: 12px 16px; max-width: 380px; margin: 0 auto 26px;
  font-weight: 700; color: var(--text);
}
.speech::after {
  content: ''; position: absolute; left: 50%; bottom: -10px; transform: translateX(-50%);
  border: 9px solid transparent; border-top-color: var(--line); border-bottom: 0;
}
.age-grid {
  display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  width: 100%; max-width: 440px; margin-bottom: 20px;
}
.age-input {
  display: flex; gap: 10px; width: 100%; max-width: 320px; margin: 0 auto 18px;
}
.age-input input {
  flex: 1; min-width: 0; text-align: center;
  font: inherit; font-size: 1.4rem; font-weight: 800;
  padding: 12px; border-radius: 14px;
  border: 2px solid var(--line); border-bottom-width: 4px;
  background: var(--bg); color: var(--text);
}
.age-input input:focus { outline: none; border-color: var(--blue); }
.step-dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 22px; }
.step-dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.step-dots i.on { background: var(--green); }

/* option tiles (onboarding + course picker) */
.tile {
  display: flex; align-items: center; gap: 12px; width: 100%;
  background: var(--card); color: var(--text);
  border: 2px solid var(--line); border-bottom-width: 4px; border-radius: var(--radius);
  padding: 14px 16px; cursor: pointer; text-align: left; font-weight: 800;
}
.tile:hover { background: var(--sunk); }
.tile.sel { border-color: var(--blue); background: var(--blue-tint); color: var(--blue-dark); }
.tile .emoji { font-size: 1.6rem; }
.tile .tile-sub { display: block; font-size: .8rem; font-weight: 700; color: var(--text-dim); }
.tile.sel .tile-sub { color: var(--blue-dark); }

/* ---------------- course switcher ---------------- */
.courses { display: flex; gap: 8px; overflow-x: auto; padding: 14px 18px 4px; max-width: 640px; margin: 0 auto; }
.course-chip {
  flex: none; display: flex; align-items: center; gap: 7px;
  border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 14px;
  background: var(--card); color: var(--text-dim);
  padding: 8px 13px; cursor: pointer; font-weight: 800; font-size: .88rem;
}
.course-chip .emoji { font-size: 1.1rem; }
.course-chip.on { border-color: currentColor; background: var(--sunk); }

/* ---------------- learning path ---------------- */
.unit {
  background: var(--sub, var(--green));
  border-radius: var(--radius);
  color: #fff; padding: 14px 18px; margin: 22px 0 6px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  box-shadow: 0 4px 0 rgba(0,0,0,.18);
}
.unit-title { font-size: 1.05rem; font-weight: 800; }
.unit-sub { font-size: .8rem; font-weight: 700; opacity: .9; }
.unit-crowns { font-size: .95rem; font-weight: 800; white-space: nowrap; }

.path { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 18px 0 6px; }
.path-row { display: flex; justify-content: center; width: 100%; }
.node {
  position: relative;
  width: 72px; height: 66px; border: 0; border-radius: 50%;
  background: var(--sub, var(--green));
  box-shadow: 0 6px 0 rgba(0,0,0,.22);
  color: #fff; font-size: 1.5rem; cursor: pointer;
  display: grid; place-items: center;
}
.node:active { transform: translateY(5px); box-shadow: 0 1px 0 rgba(0,0,0,.22); }
.node.locked { background: var(--line); box-shadow: 0 6px 0 var(--line-strong); color: var(--text-dim); }
.node.done { background: var(--yellow); box-shadow: 0 6px 0 var(--yellow-dark); }
.node.current::before {
  content: ''; position: absolute; inset: -7px; border-radius: 50%;
  border: 4px solid var(--sub, var(--green)); opacity: .35;
}
.node-flag {
  position: absolute; top: -34px; left: 50%; transform: translateX(-50%);
  background: var(--card); color: var(--sub, var(--green));
  border: 2px solid var(--line); border-bottom-width: 3px; border-radius: 10px;
  padding: 3px 10px; font-size: .68rem; font-weight: 800; letter-spacing: .8px;
  text-transform: uppercase; white-space: nowrap;
}
.path-note { text-align: center; color: var(--text-dim); font-size: .82rem; margin-top: 4px; }

.section-head { display: flex; align-items: center; justify-content: space-between; margin: 30px 0 10px; gap: 10px; }
.section-head h2 { font-size: 1.05rem; }

/* daily goal card */
.goal-card {
  display: flex; align-items: center; gap: 14px;
  border: 2px solid var(--line); border-radius: var(--radius);
  padding: 14px 16px; background: var(--card); margin-top: 6px;
}
.goal-ring {
  width: 46px; height: 46px; flex: none; border-radius: 50%;
  display: grid; place-items: center; font-size: 1.3rem;
  background: var(--sunk);
}
.goal-body { flex: 1; min-width: 0; }
.goal-body .goal-title { font-size: .95rem; }
.track { height: 12px; border-radius: 999px; background: var(--line); overflow: hidden; margin-top: 6px; }
.track > i { display: block; height: 100%; border-radius: 999px; background: var(--green); transition: width .3s ease; }
.track.blue > i { background: var(--blue); }

/* ---------------- lesson ---------------- */
.lesson-top {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 12px;
  padding: 14px 18px; background: var(--bg);
  max-width: 700px; margin: 0 auto;
}
.close-x {
  background: none; border: 0; cursor: pointer; color: var(--text-dim);
  font-size: 1.5rem; line-height: 1; padding: 0 4px;
}
.lesson-body { max-width: 700px; margin: 0 auto; padding: 10px 18px 190px; }
.kicker {
  font-size: .72rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
  color: var(--text-dim); margin-bottom: 10px;
}
.passage {
  background: var(--sunk); border-radius: 14px; padding: 14px 16px;
  font-weight: 700; font-size: .93rem; line-height: 1.65; color: var(--text);
  margin-bottom: 18px;
}
.prompt { font-size: 1.35rem; font-weight: 800; line-height: 1.4; margin: 0 0 20px; }
.prompt.big { font-size: 3.2rem; line-height: 1.15; }
.prompt.script { font-size: 3.6rem; }

.options { display: grid; gap: 11px; }
.option {
  display: flex; align-items: center; gap: 13px; width: 100%;
  background: var(--card); color: var(--text);
  border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 14px;
  padding: 14px 16px; cursor: pointer; text-align: left;
  font-weight: 700; font-size: 1rem;
}
.option:hover:not([disabled]) { background: var(--sunk); }
.option .key {
  width: 26px; height: 26px; flex: none; border-radius: 8px;
  border: 2px solid var(--line); color: var(--text-dim);
  display: grid; place-items: center; font-size: .74rem; font-weight: 800;
}
.option.sel { border-color: var(--blue); background: var(--blue-tint); color: var(--blue-dark); }
.option.sel .key { border-color: var(--blue); color: var(--blue-dark); }
.option.right { border-color: var(--green); background: var(--green-tint); color: var(--green-dark); }
.option.right .key { border-color: var(--green-dark); color: var(--green-dark); }
.option.wrong { border-color: var(--red); background: var(--red-tint); color: var(--red-dark); }
.option.wrong .key { border-color: var(--red-dark); color: var(--red-dark); }
.option[disabled] { cursor: default; }

.type-answer {
  width: 100%; font: inherit; font-size: 1.15rem; font-weight: 700;
  padding: 15px 16px; border-radius: 14px;
  border: 2px solid var(--line); border-bottom-width: 4px;
  background: var(--card); color: var(--text);
}
.type-answer:focus { outline: none; border-color: var(--blue); }
.type-answer[disabled] { opacity: .75; }

/* bottom bar + feedback */
.footbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  border-top: 2px solid var(--line); background: var(--bg);
}
.footbar.ok { background: var(--green-tint); border-top-color: transparent; }
.footbar.no { background: var(--red-tint); border-top-color: transparent; }
.footbar-inner {
  max-width: 700px; margin: 0 auto; padding: 16px 18px;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
.verdict { flex: 1; min-width: 200px; }
.verdict .headline { font-size: 1.1rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.footbar.ok .verdict { color: var(--green-dark); }
.footbar.no .verdict { color: var(--red-dark); }
.verdict .why { font-size: .86rem; font-weight: 700; opacity: .95; margin-top: 3px; }
.footbar .btn { min-width: 160px; }

/* ---------------- results ---------------- */
.result { text-align: center; padding: 30px 18px 40px; max-width: 640px; margin: 0 auto; }
.result .mascot { margin-bottom: 4px; }
.result h1 { font-size: 1.8rem; margin-bottom: 6px; }
.result .subline { color: var(--text-dim); margin-bottom: 24px; }
.tally { display: flex; gap: 12px; justify-content: center; margin-bottom: 26px; flex-wrap: wrap; }
.tally-box {
  flex: 1; min-width: 130px; border-radius: 14px; padding: 3px;
  background: var(--yellow); box-shadow: 0 3px 0 var(--yellow-dark);
}
.tally-box.blue { background: var(--blue); box-shadow: 0 3px 0 var(--blue-dark); }
.tally-box.green { background: var(--green); box-shadow: 0 3px 0 var(--green-dark); }
.tally-label {
  color: #fff; font-size: .68rem; font-weight: 800; letter-spacing: .1em;
  text-transform: uppercase; padding: 5px;
}
.tally-value {
  background: var(--card); border-radius: 12px; padding: 10px;
  font-size: 1.5rem; font-weight: 800;
}
.tally-box .tally-value { color: var(--yellow-dark); }
.tally-box.blue .tally-value { color: var(--blue); }
.tally-box.green .tally-value { color: var(--green); }

.review { text-align: left; display: grid; gap: 8px; margin: 26px 0; }
.review-item {
  border: 2px solid var(--line); border-radius: 12px; padding: 10px 13px;
  font-size: .88rem; font-weight: 700; background: var(--card);
}
.review-item.miss { border-color: var(--red); background: var(--red-tint); color: var(--red-dark); }
.review-item .r-a { font-weight: 700; opacity: .85; margin-top: 2px; }

/* ---------------- stats ---------------- */
.stat-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.stat-card {
  border: 2px solid var(--line); border-radius: var(--radius); padding: 14px 16px;
  display: flex; align-items: center; gap: 12px; background: var(--card);
}
.stat-card .big { font-size: 1.5rem; font-weight: 800; }
.stat-card .cap { font-size: .78rem; font-weight: 700; color: var(--text-dim); }
.rows { display: grid; gap: 8px; margin-top: 12px; }
.row {
  display: flex; align-items: center; gap: 12px;
  border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; background: var(--card);
}
.row-main { flex: 1; min-width: 0; }
.row-main .row-title { font-size: .95rem; }
.row-main .row-sub { font-size: .78rem; color: var(--text-dim); font-weight: 700; }
.row-num { font-size: 1rem; font-weight: 800; white-space: nowrap; }

.empty { text-align: center; color: var(--text-dim); padding: 40px 20px; font-weight: 700; }

.modal-backdrop {
  position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.45);
  display: grid; place-items: center; padding: 20px;
}
.modal {
  background: var(--card); border-radius: 20px; padding: 26px 22px;
  max-width: 380px; width: 100%; text-align: center;
}
.modal h2 { font-size: 1.25rem; margin-bottom: 8px; }
.modal p { color: var(--text-dim); font-weight: 700; margin: 0 0 20px; }
.modal .btn { width: 100%; margin-bottom: 10px; }

@media (max-width: 520px) {
  .prompt { font-size: 1.2rem; }
  .prompt.big { font-size: 2.6rem; }
  .prompt.script { font-size: 3rem; }
  .footbar .btn { width: 100%; }
  .node { width: 64px; height: 60px; font-size: 1.3rem; }
}
</style>

<script>
/* State: learner profile, XP, hearts, streak and per-lesson progress. All in localStorage. */
window.StudyHub = window.StudyHub || {};

(function (SH) {
  'use strict';

  var KEY = 'studyhub.state.v2';
  var PROFILE_KEY = 'studyhub.profile.v2';
  var THEME_KEY = 'studyhub.theme';

  var MAX_HEARTS = 5;
  var HEART_REFILL_MS = 20 * 60 * 1000;   // one heart every 20 minutes
  var LESSONS_PER_UNIT = 5;
  var QUESTIONS_PER_LESSON = 8;
  var XP_PER_LESSON = 10;

  var blank = {
    xp: 0,
    hearts: { n: MAX_HEARTS, ts: 0 },
    lessons: {},         // "subject/topic/0" -> { done: true, best: 90 }
    topics: {},          // "subject/topic"   -> { asked, correct, sessions }
    totals: { asked: 0, correct: 0 },
    days: {},            // "YYYY-MM-DD" -> questions answered
    goal: 30,            // daily XP goal
    streak: { current: 0, best: 0, last: null }
  };

  function clone(x) { return JSON.parse(JSON.stringify(x)); }

  function read() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return clone(blank);
      var data = JSON.parse(raw);
      for (var k in blank) if (!(k in data)) data[k] = clone(blank[k]);
      return data;
    } catch (e) { return clone(blank); }
  }

  function write(data) {
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* private mode: run unsaved */ }
    return data;
  }

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function today() {
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function dayDiff(a, b) {
    return Math.round((Date.parse(b + 'T00:00:00') - Date.parse(a + 'T00:00:00')) / 86400000);
  }

  /* Hearts regenerate with time, so they are always recomputed on read. */
  function settleHearts(data) {
    var h = data.hearts || { n: MAX_HEARTS, ts: 0 };
    if (h.n >= MAX_HEARTS) { h.n = MAX_HEARTS; h.ts = 0; data.hearts = h; return data; }
    if (!h.ts) h.ts = Date.now();
    var gained = Math.floor((Date.now() - h.ts) / HEART_REFILL_MS);
    if (gained > 0) {
      h.n = Math.min(MAX_HEARTS, h.n + gained);
      h.ts = h.n >= MAX_HEARTS ? 0 : h.ts + gained * HEART_REFILL_MS;
    }
    data.hearts = h;
    return data;
  }

  var Progress = {
    all: function () { return write(settleHearts(read())); },

    /* ---- hearts ---- */
    hearts: function () { return Progress.all().hearts.n; },
    heartsMax: MAX_HEARTS,
    msToNextHeart: function () {
      var d = Progress.all();
      if (d.hearts.n >= MAX_HEARTS) return 0;
      return Math.max(0, HEART_REFILL_MS - (Date.now() - d.hearts.ts));
    },
    loseHeart: function () {
      var d = Progress.all();
      if (d.hearts.n === MAX_HEARTS) d.hearts.ts = Date.now();
      d.hearts.n = Math.max(0, d.hearts.n - 1);
      write(d);
      return d.hearts.n;
    },
    refillHearts: function () {
      var d = Progress.all();
      d.hearts.n = MAX_HEARTS;
      d.hearts.ts = 0;
      return write(d).hearts.n;
    },
    gainHeart: function () {
      var d = Progress.all();
      if (d.hearts.n < MAX_HEARTS) { d.hearts.n += 1; if (d.hearts.n >= MAX_HEARTS) d.hearts.ts = 0; }
      return write(d).hearts.n;
    },

    /* ---- lessons ---- */
    lessonKey: function (s, t, i) { return s + '/' + t + '/' + i; },
    lesson: function (s, t, i) { return Progress.all().lessons[s + '/' + t + '/' + i] || null; },
    crowns: function (s, t) {
      var d = Progress.all(), n = 0;
      for (var i = 0; i < LESSONS_PER_UNIT; i++) if (d.lessons[s + '/' + t + '/' + i]) n++;
      return n;
    },
    unitComplete: function (s, t) { return Progress.crowns(s, t) >= LESSONS_PER_UNIT; },

    /* Records a finished lesson: XP, streak, accuracy and the crown. */
    finishLesson: function (opts) {

        ['What did most people believe about the ocean floor before the 1950s?', ['That it was a flat, muddy plain', 'That it was full of mountains', 'That it was made of ice', 'That it had no water'], 'The passage opens with that belief.'],
        ['Why did Marie Tharp not collect the soundings herself?', ['Women were barred from the research ships', 'She preferred to stay in the office', 'The equipment was too heavy', 'She worked in a different country'], 'The passage states women were barred from the ships.'],
        ['What did her map reveal?', ['A mountain range with a deep valley down the middle', 'A single flat plain', 'An underwater desert', 'A chain of islands'], 'She found a vast mid-ocean ridge split by a rift valley.'],
        ['What does the last sentence suggest?', ['Good evidence is not always accepted quickly', 'Her colleagues agreed at once', 'The map was inaccurate', 'She stopped working on maps'], 'It took years for colleagues to accept what she had shown.']
      ]
    },
    {
      title: 'The Cost of a Shortcut', band: 3,
      text: 'When a city widens a congested road, drivers who had been avoiding it return, and within a few years the queues are as long as before. Transport planners call this induced demand: capacity does not simply absorb existing traffic, it invites more. The same logic runs in reverse. Cities that have removed urban motorways — Seoul, San Francisco, Utrecht — generally did not see the gridlock their critics predicted, because some journeys were retimed, rerouted, or never made at all. Traffic, it turns out, behaves less like water in a pipe than like a crowd deciding where to stand.',
      questions: [
        ['What is "induced demand"?', ['New capacity attracts additional traffic', 'Traffic falls when roads widen', 'Drivers pay more for fuel', 'Roads wear out faster'], 'Extra capacity invites journeys that were not previously made.'],
        ['What happened in cities that removed motorways?', ['The predicted gridlock largely did not appear', 'Traffic doubled overnight', 'All journeys stopped', 'Roads had to be rebuilt'], 'Journeys were retimed, rerouted, or not made at all.'],
        ['What does the final comparison suggest about traffic?', ['It responds to choices rather than flowing fixedly', 'It is entirely predictable', 'It cannot be measured', 'It behaves exactly like water'], 'The crowd image stresses that drivers make decisions.'],
        ['Which statement best sums up the passage?', ['Road capacity shapes demand as much as demand shapes capacity', 'Widening roads always fixes congestion', 'Cities should never change roads', 'Traffic is caused only by population growth'], 'That two-way relationship is the central point.']
      ]
    },
    {
      title: 'The Lost Kitten', band: 1,
      text: 'Sam heard a small noise behind the shed. When he looked, a grey kitten was hiding under a flowerpot, wet and shivering. Sam wrapped it in his jumper and carried it inside. His mum put a bowl of warm milk on the floor. By evening the kitten was asleep on the sofa, purring so loudly that Sam could hear it from the kitchen.',
      questions: [
        ['Where was the kitten hiding?', ['Under a flowerpot', 'In the kitchen', 'On the sofa', 'In a tree'], 'The kitten was under a flowerpot behind the shed.'],
        ['How did Sam keep the kitten warm?', ['He wrapped it in his jumper', 'He lit a fire', 'He put it in a box', 'He gave it a hat'], 'Sam wrapped the kitten in his jumper.'],
        ['What did the kitten drink?', ['Warm milk', 'Cold water', 'Tea', 'Juice'], 'His mum put a bowl of warm milk on the floor.'],
        ['How did the kitten feel by the evening?', ['Safe and sleepy', 'Frightened', 'Hungry', 'Angry'], 'It was asleep and purring loudly, so it felt safe.']
      ]
    },
    {
      title: 'Why Bread Rises', band: 2,
      text: 'Bread dough rises because yeast, a single-celled fungus, feeds on the sugars in flour and releases carbon dioxide as a waste gas. The gluten network formed by kneading traps those bubbles, stretching like a balloon. Warmth speeds the process; cold slows it, which is why bakers sometimes leave dough in a refrigerator overnight to develop flavour without letting it grow too fast. Baking finally kills the yeast, but by then the bubbles are locked into the crumb.',
      questions: [
        ['What gas makes dough rise?', ['Carbon dioxide', 'Oxygen', 'Nitrogen', 'Steam only'], 'Yeast releases carbon dioxide as it feeds on sugars.'],
        ['What traps the gas in the dough?', ['The gluten network', 'The sugar', 'The salt', 'The oven heat'], 'Kneading forms a gluten network that holds the bubbles.'],
        ['Why do bakers chill dough overnight?', ['To slow the rise while flavour develops', 'To kill the yeast', 'To add more gas', 'To harden the crust'], 'Cold slows the yeast so flavour develops without over-rising.'],
        ['What happens to the yeast during baking?', ['It is killed by the heat', 'It multiplies rapidly', 'It turns into gluten', 'It escapes as gas'], 'Baking finally kills the yeast.']
      ]
    },
    {
      title: 'The Lighthouse Keeper', band: 3,
      text: 'For thirty-one years Ana kept the light at Cape Verity burning. The work was solitary but never idle: lamps had to be trimmed, brass polished, and the log filled in every four hours, storm or calm. When the harbour authority replaced the lamp with an automatic beacon in 1994, Ana was offered a desk job in town. She refused it. Instead she bought a small boat and began ferrying supplies to the islands, telling friends she had simply moved the same job onto the water.',
      questions: [
        ['How long did Ana keep the lighthouse?', ['Thirty-one years', 'Nineteen years', 'Since 1994', 'Four years'], 'The first sentence says "For thirty-one years".'],
        ['Why did the lighthouse job end?', ['An automatic beacon replaced the lamp', 'Ana retired because of illness', 'The harbour closed', 'She was promoted'], 'The authority installed an automatic beacon in 1994.'],
        ['What does the last sentence suggest about Ana?', ['She valued being useful to the islands', 'She disliked boats', 'She wanted an office job', 'She regretted her choice'], 'She saw ferrying supplies as the same work in a new place.'],
        ['The word "solitary" here means:', ['done alone', 'dangerous', 'poorly paid', 'occasional'], 'Solitary describes work carried out alone.']
      ]
    },
    {
      title: 'The Quiet Hour', band: 3,
      text: 'The city council introduced a "quiet hour" in the central library: between two and three each afternoon, no announcements were made, the printers were switched off, and staff answered questions in writing. It began as an accommodation for a handful of readers who found noise painful. Within a year, usage during that hour had doubled, and the council extended the practice to two other branches. What had been designed for a few turned out to be preferred by many.',
      questions: [
        ['Who was the quiet hour originally for?', ['Readers who found noise painful', 'Library staff', 'Schoolchildren', 'The council'], 'It began as an accommodation for such readers.'],
        ['What happened to use of the library during that hour?', ['It doubled', 'It halved', 'It stayed the same', 'It stopped'], 'Usage during the hour had doubled within a year.'],
        ['What is the main point of the last sentence?', ['A change made for a few can benefit many', 'Libraries should always be silent', 'The council wasted money', 'Few people used the library'], 'The accommodation turned out to be widely preferred.'],
        ['How did staff answer questions?', ['In writing', 'By phone', 'They did not answer', 'Over a loudspeaker'], 'Staff answered questions in writing.']

  /* ---------------- generators ---------------- */

  function vocabulary(n, stage) {
    var bank = U.forStage(VOCAB, stage);
    return U.sample(bank, n).map(function (w) {
      if (Math.random() < 0.5) {
        var defs = bank.filter(function (x) { return x[0] !== w[0]; }).map(function (x) { return x[2]; });
        return U.choice('What does "' + w[0] + '" mean?', w[2], defs, {
          kicker: w[1],
          explanation: '"' + w[0] + '" (' + w[1] + '): ' + w[2] + '.'
        });
      }
      var words = bank.filter(function (x) { return x[0] !== w[0]; }).map(function (x) { return x[0]; });
      return U.choice('Which word means "' + w[2] + '"?', w[0], words, {
        kicker: 'choose the word',
        explanation: '"' + w[0] + '" (' + w[1] + ') means ' + w[2] + '.'
      });
    });
  }

  function synonyms(n, stage) {
    var bank = U.forStage(PAIRS, stage);
    return U.sample(bank, n).map(function (p) {
      var wantSyn = Math.random() < 0.5;
      var correct = wantSyn ? p[1] : p[2];
      var pool = [wantSyn ? p[2] : p[1]];
      bank.forEach(function (q) { if (q[0] !== p[0]) { pool.push(q[1]); pool.push(q[2]); } });
      return U.choice('Which word is ' + (wantSyn ? 'closest in meaning' : 'the opposite') + ' to "' + p[0] + '"?', correct, pool, {
        kicker: wantSyn ? 'synonym' : 'antonym',
        explanation: '"' + p[0] + '" — similar: ' + p[1] + ', opposite: ' + p[2] + '.'
      });
    });
  }

  function grammar(n, stage) {
    return U.sample(U.forStage(GRAMMAR, stage), n).map(function (g) {
      var correct = g[1][0];
      var options = U.shuffle(g[1]);
      return {
        type: 'choice', kicker: 'complete the sentence',
        prompt: g[0], choices: options, answer: options.indexOf(correct), explanation: g[2]
      };
    });
  }

  function spelling(n, stage) {
    return U.sample(U.forStage(SPELLING, stage), n).map(function (s) {
      var options = U.shuffle([s[0]].concat(s[1]));
      return {
        type: 'choice', kicker: 'which spelling is correct?',
        prompt: 'Pick the correctly spelled word.',
        choices: options, answer: options.indexOf(s[0]),
        explanation: '"' + s[0] + '" — ' + s[2]
      };
    });
  }

  function idioms(n, stage) {
    var bank = U.forStage(IDIOMS, stage);
    return U.sample(bank, n).map(function (i) {
      var others = bank.filter(function (x) { return x[0] !== i[0]; }).map(function (x) { return x[1]; });
      return U.choice('What does "' + i[0] + '" mean?', i[1], others, {
        kicker: 'idiom', explanation: '"' + i[0] + '" means ' + i[1] + '.'
      });
    });
  }

  function reading(n, stage) {
    var bank = U.forStage(PASSAGES.map(function (p) { return [p, p.band]; }), stage).map(function (x) { return x[0]; });
    var out = [];
    var passages = U.shuffle(bank);
    for (var p = 0; p < passages.length && out.length < n; p++) {
      var pass = passages[p];
      var qs = U.shuffle(pass.questions);
      for (var i = 0; i < qs.length && out.length < n; i++) {
        var q = qs[i];
        var correct = q[1][0];
        var options = U.shuffle(q[1]);
        out.push({
          type: 'choice', kicker: 'reading · ' + pass.title, passage: pass.text,
          prompt: q[0], choices: options, answer: options.indexOf(correct), explanation: q[2]
        });
      }
    }
    // if one stage has few passages, cycle through them again rather than short-changing the lesson
    var guard = 0;
    while (out.length < n && passages.length && guard++ < 10) {
      var extra = out.slice(0, Math.min(out.length, n - out.length));
      out = out.concat(U.shuffle(extra));
    }
    return out.slice(0, n);
  }

  function cards(bank, front, back, sub) {
    return function (stage) {
      return U.forStage(bank, stage).map(function (w) {
        return { front: w[front], back: w[back], sub: sub == null ? '' : w[sub] };
      });
    };
  }

  SH.register({
    id: 'english',
    name: 'English',
    native: '',
    emoji: '📖',
    color: 'var(--english)',
    blurb: 'Words, grammar, spelling and reading.',
    topics: [
      { id: 'vocabulary', name: 'Vocabulary', desc: 'Word meanings, both directions',
        generate: vocabulary, flashcards: cards(VOCAB, 0, 2, 1) },
      { id: 'synonyms', name: 'Synonyms & Antonyms', desc: 'Words that match and words that clash',
        generate: synonyms, flashcards: cards(PAIRS, 0, 1, 2) },
      { id: 'grammar', name: 'Grammar', desc: 'Tenses, articles, prepositions, agreement',
        generate: grammar },
      { id: 'spelling', name: 'Spelling', desc: 'The words people most often get wrong',
        generate: spelling },
      { id: 'idioms', name: 'Idioms', desc: 'Everyday expressions and what they mean',
        generate: idioms, flashcards: cards(IDIOMS, 0, 1) },
      { id: 'reading', name: 'Reading', desc: 'Short passages with questions',
        generate: reading }
    ]
  });
})(window.StudyHub);

<script>
/* Math — questions are generated live and scaled to the learner's stage,
   so a six-year-old counts to twenty while a sixth-former factorises quadratics. */
(function (SH) {
  'use strict';
  var U = SH.U;

  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = b; b = a % b; a = t; } return a; }
  function lcm(a, b) { return a * b / gcd(a, b); }
  function frac(n, d) { var g = gcd(n, d) || 1; return (n / g) + '/' + (d / g); }
  function round(x, places) { var f = Math.pow(10, places == null ? 2 : places); return Math.round(x * f) / f; }
  function money(x) { return '$' + x.toFixed(2); }
  function num(prompt, value, opts) {
    var q = { type: 'input', prompt: prompt, answer: String(value), accept: [String(value)] };
    if (opts) for (var k in opts) q[k] = opts[k];
    return q;
  }

  /* ============================ arithmetic ============================ */
  var arith = {
    addSmall: function () {
      var a = U.int(1, 12), b = U.int(1, 20 - a), v = a + b;
      return U.choice(a + ' + ' + b + ' = ?', v, U.nearby(v, 4), {
        explanation: 'Start at ' + a + ' and count on ' + b + ' to reach ' + v + '.'
      });
    },
    subSmall: function () {
      var a = U.int(6, 20), b = U.int(1, a - 1), v = a - b;
      return U.choice(a + ' − ' + b + ' = ?', v, U.nearby(v, 4), {
        explanation: 'Count back ' + b + ' from ' + a + ' to land on ' + v + '. Check: ' + v + ' + ' + b + ' = ' + a + '.'
      });
    },
    doubles: function () {
      var a = U.int(2, 12), v = a * 2;
      return U.choice('Double ' + a + ' is...', v, U.nearby(v, 5), {
        explanation: a + ' + ' + a + ' = ' + v + '.'
      });
    },
    easyTables: function () {
      var a = U.pick([2, 5, 10]), b = U.int(2, 10), v = a * b;
      return U.choice(a + ' × ' + b + ' = ?', v, U.nearby(v, Math.max(4, a * 2)), {
        explanation: b + ' groups of ' + a + ' makes ' + v + '.'
      });
    },
    add: function () {
      var a = U.int(24, 480), b = U.int(24, 480), v = a + b;
      return U.choice(a + ' + ' + b + ' = ?', v, U.nearby(v, 12), {
        explanation: a + ' + ' + b + ' = ' + v + '. Add the ones, then the tens, carrying as you go.'
      });
    },
    sub: function () {
      var a = U.int(120, 900), b = U.int(20, a - 10), v = a - b;
      return U.choice(a + ' − ' + b + ' = ?', v, U.nearby(v, 12), {
        explanation: 'Check by adding back: ' + v + ' + ' + b + ' = ' + a + '.'
      });
    },
    mul: function () {
      var a = U.int(6, 19), b = U.int(6, 25), v = a * b;
      return U.choice(a + ' × ' + b + ' = ?', v, U.nearby(v, Math.max(6, Math.round(v * 0.15))), {
        explanation: 'Split it: ' + a + '×' + (b - b % 10) + ' + ' + a + '×' + (b % 10) + ' = ' + v + '.'
      });
    },
    div: function () {
      var b = U.int(3, 15), v = U.int(4, 30), a = b * v;
      return U.choice(a + ' ÷ ' + b + ' = ?', v, U.nearby(v, 6), {
        explanation: b + ' × ' + v + ' = ' + a + ', so ' + a + ' ÷ ' + b + ' = ' + v + '.'
      });
    },
    order: function () {
      var a = U.int(2, 9), b = U.int(2, 9), c = U.int(2, 12), v = a + b * c;
      return U.choice(a + ' + ' + b + ' × ' + c + ' = ?', v, [(a + b) * c, a + b + c, a * b + c, v + c, v - b], {
        explanation: 'Multiply first: ' + b + ' × ' + c + ' = ' + (b * c) + ', then add ' + a + ' to get ' + v + '.'
      });
    },
    negatives: function () {
      var a = U.int(-15, -2), b = U.int(2, 18), v = a + b;
      return U.choice('(' + a + ') + ' + b + ' = ?', v, U.nearby(v, 6), {
        explanation: 'Move ' + b + ' steps up the number line from ' + a + ' to reach ' + v + '.'
      });
    },
    factors: function () {
      var a = U.int(12, 60), b = U.int(12, 60);
      var v = gcd(a, b);
      return U.choice('What is the highest common factor of ' + a + ' and ' + b + '?', v,
        [lcm(a, b), v * 2, v + 1, Math.min(a, b), 1], {
          explanation: 'The largest number dividing both ' + a + ' and ' + b + ' exactly is ' + v + '.'
        });
    },
    lcmQ: function () {
      var a = U.int(3, 12), b = U.int(3, 12);
      var v = lcm(a, b);
      return U.choice('What is the lowest common multiple of ' + a + ' and ' + b + '?', v,
        [a * b, gcd(a, b), v + a, v - b, v * 2], {
          explanation: 'The smallest number both ' + a + ' and ' + b + ' divide into is ' + v + '.'
        });
    },
    indices: function () {
      var base = U.int(2, 7), a = U.int(2, 6), b = U.int(2, 6);
      var mult = Math.random() < 0.5;
      var v = mult ? a + b : Math.abs(a - b) || 1;
      var expr = mult ? base + '^' + a + ' × ' + base + '^' + b : base + '^' + Math.max(a, b) + ' ÷ ' + base + '^' + Math.min(a, b);
      if (!mult) v = Math.max(a, b) - Math.min(a, b);
      return U.choice('Simplify: ' + expr, base + '^' + v,
        [base + '^' + (a * b), base + '^' + (mult ? a * b : a + b), (base * base) + '^' + v, base + '^' + (v + 1), base + '^' + (v - 1)], {
          explanation: mult
            ? 'Multiplying powers of the same base adds the indices: ' + a + ' + ' + b + ' = ' + v + '.'
            : 'Dividing powers of the same base subtracts the indices: ' + Math.max(a, b) + ' − ' + Math.min(a, b) + ' = ' + v + '.'
        });
    },
    standardForm: function () {
      var mantissa = round(U.int(101, 989) / 100, 2);
      var power = U.int(3, 7);
      var value = mantissa * Math.pow(10, power);
      return U.choice('Write ' + value.toLocaleString('en-US') + ' in standard form.',
        mantissa + ' × 10^' + power,
        [mantissa + ' × 10^' + (power + 1), mantissa + ' × 10^' + (power - 1), (mantissa * 10) + ' × 10^' + power, (mantissa / 10) + ' × 10^' + power], {
          explanation: 'Move the decimal point so the first number is between 1 and 10: ' + mantissa + ' × 10^' + power + '.'
        });
    },
    sigFigs: function () {
      var value = round(U.int(10000, 999999) / 100, 2);
      var v = Number(value.toPrecision(3));
      return U.choice('Round ' + value + ' to 3 significant figures.', v,
        [Number(value.toPrecision(2)), Number(value.toPrecision(4)), Math.round(value), round(v + 1, 1)], {
          explanation: 'The first three significant digits give ' + v + '.'
        });
    },
    surds: function () {
      var sq = U.pick([4, 9, 16, 25, 36]);
      var rest = U.pick([2, 3, 5, 6, 7]);
      var inside = sq * rest;
      var v = Math.sqrt(sq) + '√' + rest;
      return U.choice('Simplify √' + inside, v,
        [inside + '√' + rest, Math.sqrt(sq) + '√' + inside, (Math.sqrt(sq) + 1) + '√' + rest, sq + '√' + rest], {
          explanation: '√' + inside + ' = √' + sq + ' × √' + rest + ' = ' + v + '.'
        });
    }
  };

  /* ====================== fractions / decimals / % ====================== */
  var fr = {
    halves: function () {
      var v = U.int(2, 12), whole = v * 2;
      return U.choice('What is half of ' + whole + '?', v, U.nearby(v, 4), {
        explanation: 'Half means split into two equal parts: ' + whole + ' ÷ 2 = ' + v + '.'
      });
    },
    fractionOf: function () {
      var d = U.pick([2, 3, 4, 5]), v = U.int(2, 8), whole = d * v;
      return U.choice('What is 1/' + d + ' of ' + whole + '?', v, U.nearby(v, 4), {
        explanation: 'Share ' + whole + ' into ' + d + ' equal groups: each is ' + v + '.'
      });
    },
    simplify: function () {
      var base = U.pick([[1, 2], [1, 3], [2, 3], [1, 4], [3, 4], [2, 5], [3, 5], [1, 6], [5, 6], [3, 8]]);
      var k = U.int(2, 9), a = base[0] * k, b = base[1] * k, v = frac(a, b);
      return U.choice('Write ' + a + '/' + b + ' in its simplest form.', v,
        [frac(a, b + k), frac(a + k, b), base[0] + '/' + (base[1] + 1), a + '/' + b], {
          explanation: 'Divide top and bottom by ' + gcd(a, b) + ': ' + a + '/' + b + ' = ' + v + '.'
        });
    },
    addSame: function () {
      var d = U.int(4, 12), a = U.int(1, d - 2), b = U.int(1, d - a), v = frac(a + b, d);
      return U.choice(a + '/' + d + ' + ' + b + '/' + d + ' = ?', v,
        [frac(a + b, d + d), (a + b) + '/' + (d * 2), frac(a + b + 1, d), frac(Math.abs(a - b), d)], {
          explanation: 'Same denominator, so add the numerators: ' + (a + b) + '/' + d + ' = ' + v + '.'
        });
    },
    addDiff: function () {
      var pair = U.pick([[2, 3], [2, 4], [3, 4], [2, 5], [3, 6], [4, 6], [3, 5]]);
      var c = pair[0], d = pair[1], a = U.int(1, c - 1), b = U.int(1, d - 1);
      var den = c * d, top = a * d + b * c, v = frac(top, den);
      return U.choice(a + '/' + c + ' + ' + b + '/' + d + ' = ?', v,
        [(a + b) + '/' + (c + d), frac(top + 1, den), frac(a * b, c * d), frac(Math.abs(a * d - b * c), den)], {
          explanation: 'Common denominator ' + den + ': ' + (a * d) + '/' + den + ' + ' + (b * c) + '/' + den + ' = ' + v + '.'
        });
    },
    multiply: function () {
      var b = U.int(3, 8), a = U.int(1, b - 1), d = U.int(3, 8), c = U.int(1, d - 1);
      var v = frac(a * c, b * d);
      return U.choice(a + '/' + b + ' × ' + c + '/' + d + ' = ?', v,
        [frac(a + c, b + d), frac(a * d, b * c), frac(a * c, b + d), frac(a + c, b * d),
         frac(a * c + 1, b * d), frac(a * c, b * d + 1)], {
          explanation: 'Multiply the tops and the bottoms: ' + (a * c) + '/' + (b * d) + ' = ' + v + '.'
        });
    },
    divide: function () {
      var b = U.int(3, 8), a = U.int(1, b - 1), d = U.int(3, 8), c = U.int(1, d - 1);
      var v = frac(a * d, b * c);
      return U.choice(a + '/' + b + ' ÷ ' + c + '/' + d + ' = ?', v,
        [frac(a * c, b * d), frac(a + d, b + c), frac(b * c, a * d), frac(a * d, b + c),
         frac(a * d + 1, b * c), frac(a * d, b * c + 1)], {
          explanation: 'Dividing by a fraction means multiplying by its reciprocal: ' + a + '/' + b + ' × ' + d + '/' + c + ' = ' + v + '.'
        });
    },
    toDecimal: function () {
      var f = U.pick([[1, 2, 0.5], [1, 4, 0.25], [3, 4, 0.75], [1, 5, 0.2], [2, 5, 0.4], [3, 5, 0.6], [4, 5, 0.8], [1, 8, 0.125], [3, 8, 0.375], [1, 10, 0.1], [7, 10, 0.7], [1, 20, 0.05]]);

<script>
/* The lesson runner: one screen at a time, hearts, check-then-continue. */
(function (SH) {
  'use strict';

  var LETTERS = ['1', '2', '3', '4', '5', '6'];

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function normalise(s) {
    return String(s).trim().toLowerCase().replace(/\s+/g, ' ').replace(/[.,!?;:]+$/, '');
  }
  function isCjk(s) { return /[㐀-鿿]/.test(s); }

  /* opts: { subject, topic, lesson, stage, mode: 'lesson' | 'practice', onExit } */
  function Lesson(root, opts) {
    this.root = root;
    this.subject = opts.subject;
    this.topic = opts.topic;
    this.lessonIndex = opts.lesson;
    this.stage = opts.stage;
    this.mode = opts.mode || 'lesson';
    this.onExit = opts.onExit;

    this.count = SH.Progress.QUESTIONS_PER_LESSON;
    this.questions = this.topic.generate(this.count, this.stage);
    this.index = 0;
    this.correct = 0;
    this.log = [];
    this.picked = null;
    this.typed = '';
    this.checked = false;
    this.finished = false;

    this.onKey = this.handleKey.bind(this);
    document.addEventListener('keydown', this.onKey);
  }

  Lesson.prototype.detach = function () { document.removeEventListener('keydown', this.onKey); };

  Lesson.prototype.handleKey = function (e) {
    if (this.finished || !document.body.contains(this.root)) return;
    if (e.key === 'Enter') {
      e.preventDefault();
      if (this.checked) this.advance();
      else if (this.picked != null || this.typed) this.check();
      return;
    }
    var q = this.questions[this.index];
    if (!q || q.type !== 'choice' || this.checked) return;
    var i = LETTERS.indexOf(e.key);
    if (i >= 0 && i < q.choices.length) {
      e.preventDefault();
      this.picked = i;
      this.draw();
    }
  };

  Lesson.prototype.check = function () {
    if (this.checked) return;
    var q = this.questions[this.index];
    var right;
    if (q.type === 'input') {
      var accepted = (q.accept || [q.answer]).map(normalise);
      right = accepted.indexOf(normalise(this.typed)) !== -1;
      this.log.push({ prompt: q.prompt, given: this.typed || '(blank)', answer: q.answer, ok: right });
    } else {
      if (this.picked == null) return;
      right = this.picked === q.answer;
      this.log.push({ prompt: q.prompt, given: q.choices[this.picked], answer: q.choices[q.answer], ok: right });
    }
    this.checked = true;
    this.lastOk = right;
    if (right) this.correct++;
    else if (this.mode === 'lesson') this.hearts = SH.Progress.loseHeart();
    this.draw();
  };

  Lesson.prototype.advance = function () {
    if (this.mode === 'lesson' && SH.Progress.hearts() <= 0) return this.outOfHearts();
    this.index++;
    this.picked = null;
    this.typed = '';
    this.checked = false;
    if (this.index >= this.questions.length) return this.finish();
    this.draw();
  };

  Lesson.prototype.finish = function () {
    this.finished = true;
    this.detach();
    var pct = Math.round((this.correct / this.questions.length) * 100);
    var passed = this.correct >= Math.ceil(this.questions.length * 0.6);
    var xp = this.mode === 'practice' ? 5 : SH.Progress.XP_PER_LESSON + (pct === 100 ? 5 : 0);

    SH.Progress.finishLesson({
      subject: this.subject.id, topic: this.topic.id, lesson: this.lessonIndex,
      correct: this.correct, asked: this.questions.length, passed: passed, xp: xp
    });
    if (this.mode === 'practice') SH.Progress.gainHeart();

    this.renderResult(pct, passed, this.mode === 'practice' ? 5 : (passed ? xp : 0));
  };

  Lesson.prototype.outOfHearts = function () {
    this.finished = true;
    this.detach();
    var self = this;
    SH.Progress.finishLesson({
      subject: this.subject.id, topic: this.topic.id, lesson: this.lessonIndex,
      correct: this.correct, asked: this.index + 1, passed: false, xp: 0
    });

    this.root.innerHTML = '';
    var box = el('div', 'result');
    box.appendChild(el('div', 'mascot', '💔'));
    box.appendChild(el('h1', null, 'You ran out of hearts'));
    box.appendChild(el('p', 'subline', 'Hearts come back over time — one every 20 minutes. Practice a finished lesson to earn one back straight away.'));
    var again = el('button', 'btn btn--wide', 'Back to the path');
    again.type = 'button';
    again.onclick = function () { self.onExit(); };
    var refill = el('button', 'btn btn--ghost btn--wide', 'Refill hearts now');
    refill.type = 'button';
    refill.style.marginTop = '10px';
    refill.onclick = function () { SH.Progress.refillHearts(); self.onExit(); };
    box.appendChild(again);
    box.appendChild(refill);
    this.root.appendChild(box);
  };

  Lesson.prototype.renderResult = function (pct, passed, xp) {
    var self = this;
    this.root.innerHTML = '';
    var box = el('div', 'result');
    box.appendChild(el('div', 'mascot', pct === 100 ? '🏆' : passed ? '🎉' : '💪'));
    box.appendChild(el('h1', null, pct === 100 ? 'Flawless!' : passed ? 'Lesson complete!' : 'Keep going!'));
    box.appendChild(el('p', 'subline',
      this.subject.name + ' · ' + this.topic.name + (passed ? '' : ' — get 60% to unlock the next lesson')));

    var tally = el('div', 'tally');
    [['green', 'Total XP', '+' + xp], ['blue', 'Accuracy', pct + '%'], ['', 'Correct', this.correct + '/' + this.questions.length]]
      .forEach(function (t) {
        var b = el('div', 'tally-box' + (t[0] ? ' ' + t[0] : ''));
        b.appendChild(el('div', 'tally-label', t[1]));
        b.appendChild(el('div', 'tally-value', t[2]));
        tally.appendChild(b);
      });
    box.appendChild(tally);

    var misses = this.log.filter(function (l) { return !l.ok; });
    if (misses.length) {
      var review = el('div', 'review');
      review.appendChild(el('div', 'kicker', 'Worth another look'));
      misses.forEach(function (m) {
        var row = el('div', 'review-item miss');
        row.appendChild(el('div', null, m.prompt));
        row.appendChild(el('div', 'r-a', 'You said "' + m.given + '" · answer: ' + m.answer));
        review.appendChild(row);
      });
      box.appendChild(review);
    }

    var cont = el('button', 'btn btn--wide', 'Continue');
    cont.type = 'button';
    cont.onclick = function () { self.onExit(); };
    box.appendChild(cont);

    var again = el('button', 'btn btn--ghost btn--wide', 'Practise again');
    again.type = 'button';
    again.style.marginTop = '10px';
    again.onclick = function () {
      SH.startLesson(self.root, {
        subject: self.subject, topic: self.topic, lesson: self.lessonIndex,
        stage: self.stage, mode: self.mode, onExit: self.onExit
      });
    };
    box.appendChild(again);

    this.root.appendChild(box);
    window.scrollTo(0, 0);
  };

  Lesson.prototype.draw = function () {
    var self = this;
    var q = this.questions[this.index];
    this.root.innerHTML = '';

    /* --- top bar: quit, progress, hearts --- */
    var top = el('div', 'lesson-top');
    var quit = el('button', 'close-x', '✕');
    quit.type = 'button';
    quit.title = 'Quit lesson';
    quit.onclick = function () { self.detach(); self.onExit(); };
    top.appendChild(quit);

    var track = el('div', 'track');
    track.style.flex = '1';
    var fill = el('i');
    fill.style.width = Math.round((this.index / this.questions.length) * 100) + '%';
    track.appendChild(fill);
    top.appendChild(track);

    if (this.mode === 'lesson') {
      top.appendChild(el('span', 'stat-pill heart', '❤️ ' + SH.Progress.hearts()));
    } else {
      top.appendChild(el('span', 'stat-pill dim', '∞'));
    }
    this.root.appendChild(top);

    /* --- question --- */
    var body = el('div', 'lesson-body');
    body.appendChild(el('div', 'kicker', q.kicker || this.topic.name));
    if (q.passage) body.appendChild(el('div', 'passage', q.passage));

    var promptCls = 'prompt' + (q.promptBig ? ' big' : '') + (isCjk(q.prompt) && q.promptBig ? ' script' : '');
    body.appendChild(el('h2', promptCls, q.prompt));

    if (q.type === 'input') {
      var input = el('input', 'type-answer');
      input.type = 'text';
      input.autocomplete = 'off';
      input.placeholder = 'Type your answer';
      input.value = this.typed;
      input.disabled = this.checked;
      input.oninput = function () { self.typed = input.value; self.syncCheckButton(); };
      body.appendChild(input);
      if (!this.checked) setTimeout(function () { input.focus(); }, 0);
    } else {
      var options = el('div', 'options');
      q.choices.forEach(function (text, i) {
        var b = el('button', 'option');
        b.type = 'button';
        if (self.checked) {
          b.disabled = true;
          if (i === q.answer) b.className = 'option right';
          else if (i === self.picked) b.className = 'option wrong';
        } else if (self.picked === i) {
          b.className = 'option sel';
        }
        b.appendChild(el('span', 'key', LETTERS[i]));
        b.appendChild(el('span', null, text));
        b.onclick = function () { self.picked = i; self.draw(); };
        options.appendChild(b);
      });
      body.appendChild(options);
    }
    this.root.appendChild(body);

    /* --- bottom bar --- */
    var bar = el('div', 'footbar' + (this.checked ? (this.lastOk ? ' ok' : ' no') : ''));
    var inner = el('div', 'footbar-inner');

    if (this.checked) {
      var verdict = el('div', 'verdict');
      var head = el('div', 'headline');
      head.appendChild(el('span', null, this.lastOk ? '✓' : '✕'));
      head.appendChild(el('span', null, this.lastOk ? 'Nicely done!' : 'Correct answer: ' +
        (q.type === 'input' ? q.answer : q.choices[q.answer])));
      verdict.appendChild(head);
      if (q.explanation) verdict.appendChild(el('div', 'why', q.explanation));
      inner.appendChild(verdict);

      var cont = el('button', 'btn' + (this.lastOk ? '' : ' btn--red'),
        this.index + 1 >= this.questions.length ? 'Finish' : 'Continue');
      cont.type = 'button';
      cont.onclick = function () { self.advance(); };
      inner.appendChild(cont);
      setTimeout(function () { cont.focus(); }, 0);
    } else {
      inner.appendChild(el('div', 'verdict small muted',
        q.type === 'input' ? 'Type your answer, then press Enter' : 'Pick an answer — or press 1–' + q.choices.length));
      var checkBtn = el('button', 'btn', 'Check');
      checkBtn.type = 'button';
      checkBtn.disabled = q.type === 'input' ? !this.typed : this.picked == null;
      checkBtn.onclick = function () { self.check(); };
      this.checkBtn = checkBtn;
      inner.appendChild(checkBtn);
    }

    bar.appendChild(inner);
    this.root.appendChild(bar);
  };

  Lesson.prototype.syncCheckButton = function () {
    if (this.checkBtn) this.checkBtn.disabled = !this.typed;
  };

  SH.startLesson = function (root, opts) {
    var l = new Lesson(root, opts);
    l.draw();
    window.scrollTo(0, 0);
    return l;
  };

  /* ---------------- flashcards ---------------- */
  SH.renderFlashcards = function (root, subject, topic, stage, onExit) {
    var cards = SH.U.shuffle(topic.flashcards(stage));
    var i = 0, flipped = false;

    function draw() {
      root.innerHTML = '';
      var top = el('div', 'lesson-top');
      var quit = el('button', 'close-x', '✕');
      quit.type = 'button';
      quit.onclick = function () { document.removeEventListener('keydown', keys); onExit(); };
      top.appendChild(quit);
      var track = el('div', 'track');
      track.style.flex = '1';
      var fill = el('i');
      fill.style.width = Math.round(((i + 1) / cards.length) * 100) + '%';
      track.appendChild(fill);
      top.appendChild(track);
      top.appendChild(el('span', 'stat-pill dim', (i + 1) + '/' + cards.length));
      root.appendChild(top);

      var c = cards[i];
      var body = el('div', 'lesson-body center');
      body.appendChild(el('div', 'kicker', subject.name + ' · ' + topic.name));
      var face = el('h2', 'prompt big' + (isCjk(c.front) ? ' script' : ''), c.front);
      face.style.cursor = 'pointer';
      face.onclick = function () { flipped = !flipped; draw(); };
      body.appendChild(face);
      if (flipped) {
        body.appendChild(el('div', 'prompt', c.back));
        if (c.sub) body.appendChild(el('div', 'muted', c.sub));
      } else {
        body.appendChild(el('div', 'muted', 'Tap the card or press Space to reveal'));
      }
      root.appendChild(body);

      var bar = el('div', 'footbar');
      var inner = el('div', 'footbar-inner');
      var prev = el('button', 'btn btn--ghost', 'Back');
      prev.type = 'button';
      prev.onclick = function () { i = (i - 1 + cards.length) % cards.length; flipped = false; draw(); };
      var flip = el('button', 'btn btn--blue', flipped ? 'Hide' : 'Reveal');
      flip.type = 'button';
      flip.onclick = function () { flipped = !flipped; draw(); };
      var next = el('button', 'btn', 'Next');
      next.type = 'button';
      next.onclick = function () { i = (i + 1) % cards.length; flipped = false; draw(); };
      inner.appendChild(prev);
      inner.appendChild(flip);
      inner.appendChild(next);
      bar.appendChild(inner);
      root.appendChild(bar);
    }

    function keys(e) {
      if (!document.body.contains(root)) { document.removeEventListener('keydown', keys); return; }
      if (e.key === 'ArrowRight') { i = (i + 1) % cards.length; flipped = false; draw(); }
      else if (e.key === 'ArrowLeft') { i = (i - 1 + cards.length) % cards.length; flipped = false; draw(); }
      else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flipped = !flipped; draw(); }
    }
    document.addEventListener('keydown', keys);
    draw();
    window.scrollTo(0, 0);
  };
})(window.StudyHub);
</script>
<script>
/* Shell: onboarding, the HUD, the lesson path and the stats pages. */
(function (SH) {
  'use strict';

  var hudEl, appEl;
  var state = { view: 'path', subjectId: 'english', onboardStep: 0, draftAge: null };

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function btn(cls, text, onClick) {
    var b = el('button', cls, text);
    b.type = 'button';
    b.onclick = onClick;
    return b;
  }
  function profile() { return SH.Profile.get(); }
  function stage() { var p = profile(); return p ? p.stageIndex : 2; }

  var COURSE_KEY = 'studyhub.course';

  function go(view, subjectId) {
    state.view = view;
    if (subjectId) {
      state.subjectId = subjectId;
      try { localStorage.setItem(COURSE_KEY, subjectId); } catch (e) {}
    }
    render();
  }
  SH.go = go;

  /* ---------------------------- HUD ---------------------------- */
  function renderHud() {
    hudEl.innerHTML = '';
    if (state.view === 'onboard' || state.view === 'lesson') return;

    var bar = el('div', 'hud');
    bar.appendChild(btn('brand', '📚 StudyHub', function () { go('path'); }));
    bar.appendChild(el('div', 'hud-spacer'));

    var data = SH.Progress.all();
    bar.appendChild(el('span', 'stat-pill fire', '🔥 ' + data.streak.current));
    bar.appendChild(el('span', 'stat-pill gem', '💎 ' + data.xp));
    bar.appendChild(el('span', 'stat-pill heart', '❤️ ' + data.hearts.n));
    bar.appendChild(btn('icon-btn', '📊', function () { go('stats'); }));
    bar.appendChild(btn('icon-btn', '👤', function () { go('profile'); }));
    bar.appendChild(btn('icon-btn', document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙',
      function () { SH.Theme.toggle(); render(); }));
    hudEl.appendChild(bar);

    if (state.view !== 'path') return;
    var chips = el('div', 'courses');
    SH.subjects.forEach(function (s) {
      var c = el('button', 'course-chip' + (s.id === state.subjectId ? ' on' : ''));
      c.type = 'button';
      c.style.color = s.id === state.subjectId ? s.color : '';
      c.appendChild(el('span', 'emoji', s.emoji));
      c.appendChild(el('span', null, s.name + (s.native ? ' ' + s.native : '')));
      c.onclick = function () { go('path', s.id); };
      chips.appendChild(c);
    });
    hudEl.appendChild(chips);
  }

  /* ------------------------- onboarding ------------------------- */
  function renderOnboard() {
    appEl.innerHTML = '';
    var box = el('div', 'onboard');

    var dots = el('div', 'step-dots');
    for (var i = 0; i < 3; i++) dots.appendChild(el('i', i <= state.onboardStep ? 'on' : ''));

    if (state.onboardStep === 0) {
      box.appendChild(el('div', 'mascot', '📚'));
      box.appendChild(el('h1', null, 'Welcome to StudyHub'));
      box.appendChild(el('p', null, 'Bite-sized lessons in English, Math, Science and Chinese — matched to your school year.'));
      box.appendChild(dots);
      box.appendChild(btn('btn btn--wide', 'Get started', function () { state.onboardStep = 1; render(); }));
      box.style.maxWidth = '420px';
      box.style.margin = '0 auto';
      appEl.appendChild(box);
      return;
    }

    if (state.onboardStep === 1) {
      box.appendChild(el('div', 'mascot', '🎂'));
      box.appendChild(el('h1', null, 'How old are you?'));
      box.appendChild(el('div', 'speech', 'Your age sets the syllabus — the questions, the vocabulary and the difficulty all follow it.'));

      var grid = el('div', 'age-grid');
      SH.Profile.stages.forEach(function (st, idx) {
        var t = el('button', 'tile' + (state.draftAge != null && SH.Profile.stageForAge(state.draftAge) === idx ? ' sel' : ''));
        t.type = 'button';
        var body = el('div');
        body.appendChild(el('div', null, st.label));
        body.appendChild(el('span', 'tile-sub', st.name));
        t.appendChild(el('span', 'emoji', ['🧸', '🎒', '📐', '🔬', '🎓'][idx]));
        t.appendChild(body);
        t.onclick = function () {
          state.draftAge = Math.min(st.max, Math.max(st.min, st.min + 1));
          render();
        };
        grid.appendChild(t);
      });
      box.appendChild(grid);

      var form = el('form', 'age-input');
      var input = el('input');
      input.type = 'number';
      input.min = '3';
      input.max = '120';
      input.placeholder = 'Exact age';
      if (state.draftAge != null) input.value = state.draftAge;
      form.appendChild(input);
      form.onsubmit = function (e) { e.preventDefault(); saveAge(); };
      box.appendChild(form);

      /* live syllabus preview, updated in place so the field keeps focus */
      var preview = el('p', 'muted small');
      preview.id = 'syllabusPreview';
      box.appendChild(preview);

      function syncAge() {
        var ok = state.draftAge >= 3 && state.draftAge <= 120;
        var next = document.getElementById('ageNext');
        if (next) next.disabled = !ok;
        preview.textContent = ok
          ? 'Syllabus: ' + SH.Profile.stages[SH.Profile.stageForAge(state.draftAge)].name +
            ' · ' + SH.Profile.stages[SH.Profile.stageForAge(state.draftAge)].grades
          : 'Pick a band above or type your exact age.';
      }
      input.oninput = function () {
        var v = parseInt(input.value, 10);
        state.draftAge = isFinite(v) ? v : null;
        syncAge();
      };
      setTimeout(syncAge, 0);

      box.appendChild(dots);
      var next = btn('btn btn--wide', 'Continue', saveAge);
      next.id = 'ageNext';
      next.disabled = !(state.draftAge >= 3 && state.draftAge <= 120);
      box.appendChild(next);
      box.style.maxWidth = '460px';
      box.style.margin = '0 auto';
      appEl.appendChild(box);
      return;
    }

    // step 2: choose the first course
    var p = profile();
    box.appendChild(el('div', 'mascot', '🚀'));
    box.appendChild(el('h1', null, 'Where would you like to start?'));
    box.appendChild(el('p', null, 'You are on the ' + p.stage.name + ' syllabus (' + p.stage.grades + '). You can switch subjects any time.'));
    var list = el('div', 'age-grid');
    list.style.gridTemplateColumns = '1fr';
    SH.subjects.forEach(function (s) {
      var t = el('button', 'tile');
      t.type = 'button';
      t.appendChild(el('span', 'emoji', s.emoji));
      var body = el('div');
      body.appendChild(el('div', null, s.name + (s.native ? '  ' + s.native : '')));
      body.appendChild(el('span', 'tile-sub', s.blurb));
      t.appendChild(body);
      t.onclick = function () { go('path', s.id); };
      list.appendChild(t);
    });
    box.appendChild(list);
    box.appendChild(dots);
    box.style.maxWidth = '460px';
    box.style.margin = '0 auto';
    appEl.appendChild(box);
  }

  function saveAge() {
    if (!(state.draftAge >= 3 && state.draftAge <= 120)) return;
    SH.Profile.set(state.draftAge);
    state.onboardStep = 2;
    render();
  }

  /* --------------------------- the path --------------------------- */
  function renderPath() {
    appEl.innerHTML = '';
    var subject = SH.subject(state.subjectId) || SH.subjects[0];
    var p = profile();
    var st = stage();
    var wrap = el('div', 'wrap');

    /* daily goal */
    var data = SH.Progress.all();
    var doneToday = SH.Progress.xpToday();
    var goal = data.goal;
    var card = el('div', 'goal-card');
    card.appendChild(el('div', 'goal-ring', doneToday >= goal ? '✅' : '🎯'));
    var gb = el('div', 'goal-body');
    gb.appendChild(el('div', 'goal-title', doneToday >= goal ? 'Daily goal complete!' : 'Daily goal'));
    gb.appendChild(el('div', 'muted small', doneToday + ' / ' + goal + ' questions answered today · 🔥 ' + data.streak.current + ' day streak'));
    var track = el('div', 'track');
    var fill = el('i');
    fill.style.width = Math.min(100, Math.round((doneToday / goal) * 100)) + '%';
    track.appendChild(fill);
    gb.appendChild(track);
    card.appendChild(gb);
    wrap.appendChild(card);

    var head = el('div', 'section-head');
    var h = el('div');
    h.appendChild(el('h2', null, subject.name + (subject.native ? ' ' + subject.native : '')));
    h.appendChild(el('div', 'muted small', p.stage.name + ' syllabus · ' + p.stage.grades));
    head.appendChild(h);
    wrap.appendChild(head);

    subject.topics.forEach(function (topic, unitIndex) {
      var crowns = SH.Progress.crowns(subject.id, topic.id);
      var prevComplete = unitIndex === 0 || SH.Progress.unitComplete(subject.id, subject.topics[unitIndex - 1].id);

      var unit = el('div', 'unit');
      unit.style.setProperty('--sub', subject.color);
      var left = el('div');
      left.appendChild(el('div', 'unit-title', 'Unit ' + (unitIndex + 1) + ' · ' + topic.name));
      left.appendChild(el('div', 'unit-sub', (topic.stageDesc && topic.stageDesc[st]) || topic.desc));
      unit.appendChild(left);
      unit.appendChild(el('div', 'unit-crowns', '👑 ' + crowns + '/' + SH.Progress.LESSONS_PER_UNIT));
      wrap.appendChild(unit);

      var path = el('div', 'path');
      for (var i = 0; i < SH.Progress.LESSONS_PER_UNIT; i++) {
        (function (lessonIndex) {
          var done = !!SH.Progress.lesson(subject.id, topic.id, lessonIndex);
          var prevLessonDone = lessonIndex === 0 || !!SH.Progress.lesson(subject.id, topic.id, lessonIndex - 1);
          var open = prevComplete && prevLessonDone;
          var isCurrent = open && !done;

          var row = el('div', 'path-row');
          // stepping stones: the path snakes left and right down the page
          row.style.transform = 'translateX(' + [0, 62, 90, 62, 0][lessonIndex] * (unitIndex % 2 ? -1 : 1) + 'px)';

          var node = el('button', 'node' + (done ? ' done' : open ? '' : ' locked') + (isCurrent ? ' current' : ''));
          node.type = 'button';
          node.style.setProperty('--sub', subject.color);
          node.textContent = done ? '👑' : open ? '★' : '🔒';
          node.title = 'Lesson ' + (lessonIndex + 1);
          if (isCurrent) {
            node.appendChild(el('span', 'node-flag', lessonIndex === 0 && crowns === 0 ? 'Start' : 'Continue'));
            row.style.marginTop = '24px';   // room for the flag above the node
          }
          node.onclick = function () {
            if (!open) return lockedModal(subject, topic, lessonIndex);
            startLesson(subject, topic, lessonIndex, done ? 'practice' : 'lesson');
          };
          row.appendChild(node);
          path.appendChild(row);
        })(i);
      }
      wrap.appendChild(path);

      var actions = el('div', 'section-head');
      actions.style.margin = '4px 0 0';
      var practice = btn('btn btn--ghost', '🔁 Practice', function () {
        startLesson(subject, topic, 0, 'practice');
      });
      actions.appendChild(practice);
      if (topic.flashcards) {
        actions.appendChild(btn('btn btn--ghost', '🗂 Cards', function () {
          state.view = 'lesson';
          renderHud();
          appEl.innerHTML = '';
          SH.renderFlashcards(appEl, subject, topic, st, function () { go('path'); });
        }));
      }
      wrap.appendChild(actions);
    });

    appEl.appendChild(wrap);
  }

  function startLesson(subject, topic, lessonIndex, mode) {
    if (mode === 'lesson' && SH.Progress.hearts() <= 0) return noHeartsModal();
    state.view = 'lesson';
    renderHud();
    appEl.innerHTML = '';
    SH.startLesson(appEl, {
      subject: subject, topic: topic, lesson: lessonIndex, stage: stage(), mode: mode,
      onExit: function () { go('path'); }
    });
  }

  function modal(title, text, buttons) {
    var back = el('div', 'modal-backdrop');
    var box = el('div', 'modal');
    box.appendChild(el('h2', null, title));
    box.appendChild(el('p', null, text));
    buttons.forEach(function (b) {
      box.appendChild(btn(b.cls || 'btn btn--wide', b.label, function () {
        document.body.removeChild(back);
        if (b.action) b.action();
      }));
    });
    back.appendChild(box);
    back.onclick = function (e) { if (e.target === back) document.body.removeChild(back); };
    document.body.appendChild(back);
  }

  function lockedModal(subject, topic, lessonIndex) {
    modal('Locked for now', 'Finish the lessons before it to unlock this one — or jump straight in if you already know the material.', [
      { label: 'Jump ahead', action: function () { startLesson(subject, topic, lessonIndex, 'lesson'); } },
      { label: 'Not yet', cls: 'btn btn--ghost btn--wide' }
    ]);
  }

  function noHeartsModal() {
    var mins = Math.ceil(SH.Progress.msToNextHeart() / 60000);
    modal('Out of hearts', 'The next heart arrives in about ' + mins + ' minute' + (mins === 1 ? '' : 's') +
      '. Practising a finished lesson earns one back straight away.', [
      { label: 'Refill now', action: function () { SH.Progress.refillHearts(); render(); } },
      { label: 'Wait', cls: 'btn btn--ghost btn--wide' }
    ]);
  }

  /* ---------------------------- stats ---------------------------- */
  function renderStats() {
    appEl.innerHTML = '';
    var data = SH.Progress.all();
    var wrap = el('div', 'wrap wrap--wide');
    wrap.appendChild(el('h1', null, 'Your progress'));
    wrap.appendChild(el('p', 'muted', 'Everything is stored on this device only.'));

    var acc = data.totals.asked ? Math.round((data.totals.correct / data.totals.asked) * 100) : 0;
    var crowns = Object.keys(data.lessons).length;
    var grid = el('div', 'stat-grid');
    [['💎', data.xp, 'Total XP'], ['🔥', data.streak.current, 'Day streak'],
     ['👑', crowns, 'Lessons cleared'], ['🎯', acc + '%', 'Accuracy'],
     ['❓', data.totals.asked, 'Questions answered'], ['🏅', data.streak.best, 'Best streak']]
      .forEach(function (s) {
        var c = el('div', 'stat-card');
        c.appendChild(el('div', 'big', s[0]));
        var b = el('div');
        b.appendChild(el('div', 'big', String(s[1])));
        b.appendChild(el('div', 'cap', s[2]));
        c.appendChild(b);
        grid.appendChild(c);
      });
    wrap.appendChild(grid);

    SH.subjects.forEach(function (s) {
      var sub = SH.Progress.subject(s.id);
      wrap.appendChild(el('h2', 'section-head', ''));
      var head = wrap.lastChild;
      head.appendChild(el('h2', null, s.emoji + '  ' + s.name));
      head.appendChild(el('span', 'muted small',
        sub.asked ? Math.round((sub.correct / sub.asked) * 100) + '% over ' + sub.asked + ' questions' : 'not started'));

      var rows = el('div', 'rows');
      s.topics.forEach(function (t) {
        var stats = SH.Progress.topic(s.id, t.id);
        var crownCount = SH.Progress.crowns(s.id, t.id);
        var row = el('div', 'row');
        var main = el('div', 'row-main');
        main.appendChild(el('div', 'row-title', t.name));
        var track = el('div', 'track blue');
        var fill = el('i');
        fill.style.width = Math.round((crownCount / SH.Progress.LESSONS_PER_UNIT) * 100) + '%';
        track.appendChild(fill);
        main.appendChild(track);
        row.appendChild(main);
        row.appendChild(el('div', 'row-num',
          stats.asked ? Math.round((stats.correct / stats.asked) * 100) + '%' : '—'));
        row.appendChild(el('div', 'row-num', '👑 ' + crownCount));
        rows.appendChild(row);
      });
      wrap.appendChild(rows);
    });

    appEl.appendChild(wrap);
  }

  /* --------------------------- profile --------------------------- */
  function renderProfile() {
    appEl.innerHTML = '';
    var p = profile();
    var wrap = el('div', 'wrap');
    wrap.appendChild(el('h1', null, 'Your syllabus'));

    var card = el('div', 'goal-card');
    card.appendChild(el('div', 'goal-ring', '🎓'));
    var body = el('div', 'goal-body');
    body.appendChild(el('div', 'goal-title', 'Age ' + p.age + ' · ' + p.stage.name));
    body.appendChild(el('div', 'muted small', p.stage.grades));
    card.appendChild(body);
    wrap.appendChild(card);

    wrap.appendChild(el('h2', 'section-head', ''));
    wrap.lastChild.appendChild(el('h2', null, 'What you are studying'));
    var rows = el('div', 'rows');
    SH.subjects.forEach(function (s) {
      s.topics.forEach(function (t) {
        var row = el('div', 'row');
        var main = el('div', 'row-main');
        main.appendChild(el('div', 'row-title', s.emoji + '  ' + t.name));
        main.appendChild(el('div', 'row-sub', (t.stageDesc && t.stageDesc[p.stageIndex]) || t.desc));
        row.appendChild(main);
        rows.appendChild(row);
      });
    });
    wrap.appendChild(rows);

    wrap.appendChild(el('h2', 'section-head', ''));
    wrap.lastChild.appendChild(el('h2', null, 'Settings'));

    var goalRow = el('div', 'row');
    var goalMain = el('div', 'row-main');
    goalMain.appendChild(el('div', 'row-title', 'Daily goal'));
    goalMain.appendChild(el('div', 'row-sub', 'Questions to answer each day'));
    goalRow.appendChild(goalMain);
    [10, 30, 50].forEach(function (g) {
      var b = btn('btn btn--ghost' + (SH.Progress.all().goal === g ? ' sel' : ''), String(g), function () {
        SH.Progress.setGoal(g);
        render();
      });
      b.style.minHeight = '38px';
      b.style.padding = '6px 12px';
      if (SH.Progress.all().goal === g) { b.style.borderColor = 'var(--green)'; b.style.color = 'var(--green)'; }
      goalRow.appendChild(b);
    });
    wrap.appendChild(goalRow);

    var actions = el('div', 'rows');
    actions.appendChild(btn('btn btn--ghost btn--wide', 'Change my age', function () {
      state.draftAge = p.age;
      state.onboardStep = 1;
      go('onboard');
    }));
    actions.appendChild(btn('btn btn--ghost btn--wide', 'Refill hearts', function () {
      SH.Progress.refillHearts();
      render();
    }));
    actions.appendChild(btn('btn btn--red btn--wide', 'Reset all progress', function () {
      modal('Reset everything?', 'This clears your XP, streak, crowns and age. It cannot be undone.', [
        { label: 'Yes, reset', cls: 'btn btn--red btn--wide', action: function () {
          SH.Progress.reset();
          SH.Profile.clear();
          state.onboardStep = 0;
          state.draftAge = null;
          go('onboard');
        } },
        { label: 'Cancel', cls: 'btn btn--ghost btn--wide' }
      ]);
    }));
    wrap.appendChild(actions);

    appEl.appendChild(wrap);
  }

  /* ---------------------------- render ---------------------------- */
  function render() {
    if (!profile() && state.view !== 'onboard') state.view = 'onboard';
    renderHud();
    if (state.view === 'onboard') return renderOnboard();
    if (state.view === 'stats') return renderStats();
    if (state.view === 'profile') return renderProfile();
    if (state.view === 'lesson') return;   // the lesson runner owns the screen
    renderPath();
  }

  document.addEventListener('DOMContentLoaded', function () {
    hudEl = document.getElementById('hud');
    appEl = document.getElementById('app');
    SH.Theme.init();
    try {
      var saved = localStorage.getItem(COURSE_KEY);
      if (saved && SH.subject(saved)) state.subjectId = saved;
    } catch (e) {}
    if (!profile()) { state.view = 'onboard'; state.onboardStep = 0; }
    render();
  });
})(window.StudyHub);
</script>
</body>
</html>
