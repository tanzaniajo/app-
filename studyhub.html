      wrap.appendChild(grid);

      /* Slide the piece that just moved. The board has already been rebuilt in its
         new state, so the piece is placed at its destination, shifted back to where
         it came from, and then released — the browser animates the difference. */
      if (game.anim) {
        var anim = game.anim;
        game.anim = null;
        requestAnimationFrame(function () {
          slide(cells[anim.from], cells[anim.to]);
          if (anim.rookFrom != null) slide(cells[anim.rookFrom], cells[anim.rookTo]);
        });
      }
      return wrap;
    }

    function slide(fromCell, toCell) {
      if (!fromCell || !toCell) return;
      var piece = toCell.querySelector('.piece');
      if (!piece) return;
      var a = fromCell.getBoundingClientRect(), b = toCell.getBoundingClientRect();
      var dx = a.left - b.left, dy = a.top - b.top;
      if (!dx && !dy) return;
      piece.classList.add('moving');
      piece.style.transition = 'none';
      piece.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
      // force the browser to accept the offset before transitioning away from it
      void piece.offsetWidth;
      piece.style.transition = 'transform ' + ANIM_MS + 'ms cubic-bezier(.2,.7,.3,1)';
      piece.style.transform = 'translate(0,0)';
      setTimeout(function () {
        piece.classList.remove('moving');
        piece.style.transition = '';
        piece.style.transform = '';
      }, ANIM_MS + 30);
    }

    function drawMoveList() {
      var box = el('div', 'movelist');
      for (var i = 0; i < game.history.length; i += 2) {
        var row = el('div', 'move-row');
        row.appendChild(el('span', 'move-no', (i / 2 + 1) + '.'));
        row.appendChild(el('span', 'move-san', game.history[i].san));
        row.appendChild(el('span', 'move-san', game.history[i + 1] ? game.history[i + 1].san : ''));
        box.appendChild(row);
      }
      if (!game.history.length) box.appendChild(el('div', 'muted small', 'No moves yet.'));
      setTimeout(function () { box.scrollTop = box.scrollHeight; }, 0);
      return box;
    }

    function statusLine() {
      if (game.over) return game.resultDetail;
      if (game.thinking) return game.premove ? 'The bot is thinking… (premove ready)' : 'The bot is thinking — you can premove';
      if (Chess.inCheck(game.state, game.state.turn)) {
        return game.state.turn === game.player ? 'You are in check!' : 'The bot is in check';
      }
      return game.state.turn === game.player ? 'Your move' : 'Bot to move';
    }

    function draw() {
      root.innerHTML = '';

      var top = el('div', 'lesson-top');
      top.appendChild(btn('close-x', '✕', function () { onExit(); }));
      top.appendChild(el('div', 'quiz-count', '≈' + game.elo + ' ' + game.level.name));
      top.appendChild(el('div', 'hud-spacer'));
      var edge = materialEdge();
      top.appendChild(el('span', 'stat-pill ' + (edge > 0 ? 'gem' : edge < 0 ? 'heart' : 'dim'),
        edge > 0 ? '+' + edge : edge < 0 ? String(edge) : 'even'));
      root.appendChild(top);

      var body = el('div', 'lesson-body');
      body.appendChild(el('div', 'kicker', 'you play ' + (game.player === 'w' ? 'white' : 'black')));
      body.appendChild(drawBoard());

      var status = el('div', 'play-status' + (game.over ? ' over' : ''));
      status.appendChild(el('strong', null, statusLine()));
      if (game.over && game.xpEarned) status.appendChild(el('span', 'muted', '  +' + game.xpEarned + ' XP'));
      body.appendChild(status);

      if (game.premove && !game.over) {
        var note = el('div', 'premove-note');
        note.appendChild(el('span', null, 'Premove: ' + Chess.sqName(game.premove.from) + ' → ' + Chess.sqName(game.premove.to)));
        note.appendChild(btn('link', 'Cancel', function () { game.premove = null; sfx('tap'); draw(); }));
        body.appendChild(note);
      }

      if (game.over) {
        var again = el('div', 'play-actions');
        again.appendChild(btn('btn', 'Play again', function () { startGame(root, game.elo, game.player, onExit); }));
        again.appendChild(btn('btn btn--ghost', 'Change opponent', function () { renderPicker(root, onExit); }));
        body.appendChild(again);
      } else {
        var actions = el('div', 'play-actions');
        actions.appendChild(btn('btn btn--ghost', 'Undo', undoMove));
        actions.appendChild(btn('btn btn--ghost', 'Resign', resign));
        actions.appendChild(btn('btn btn--ghost', 'New game', function () { renderPicker(root, onExit); }));
        body.appendChild(actions);
      }

      body.appendChild(el('div', 'kicker', 'moves'));
      body.appendChild(drawMoveList());
      root.appendChild(body);

      if (game.promo) drawPromotion();
    }

    function drawPromotion() {
      var back = el('div', 'modal-backdrop');
      var box = el('div', 'modal');
      box.appendChild(el('h2', null, 'Promote your pawn'));
      var row = el('div', 'promo-row');
      game.promo.options.forEach(function (m) {
        var kind = String(m.promo).toLowerCase();
        var b = el('button', 'promo-btn');
        b.type = 'button';
        var art = el('span', 'piece');
        art.innerHTML = Pieces.svg(game.player === 'w' ? kind.toUpperCase() : kind);
        b.appendChild(art);
        b.appendChild(el('span', 'promo-name', NAME[kind]));
        b.onclick = function () {
          game.promo = null;
          document.body.removeChild(back);
          applyMove(m);
          if (finishIfOver()) draw();
          else botMove();
        };
        row.appendChild(b);
      });
      box.appendChild(row);
      back.appendChild(box);
      document.body.appendChild(back);
    }

    /* test hook: tools and the browser tests drive real games through this */
    SH._game = {
      get: function () { return game; },
      fen: function () { return Chess.toFen(game.state); },
      move: function (from, to) { playerMove(Chess.nameToSq(from), Chess.nameToSq(to)); },
      select: function (name) { selectSquare(Chess.nameToSq(name)); },
      load: function (fen) {
        game.state = Chess.createGame(fen);
        game.history = [];
        game.lastMove = null;
        game.selected = -1;
        game.targets = [];
        game.over = false;
        game.result = null;
        draw();
        if (game.state.turn !== game.player) botMove();
      },
      redraw: draw
    };

    draw();
    window.scrollTo(0, 0);
    if (game.state.turn !== game.player) botMove();
  }

  SH.startPlay = function (root, opts) {
    renderPicker(root, opts.onExit);
  };
})(window.StudyHub);
</script>
<script>
/* The Coach screens: pick a question you got wrong, say what you think went
   wrong, get corrected, rewrite the answer, get corrected again. */
(function (SH) {
  'use strict';

  var Coach = SH.Coach;

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function btn(cls, text, onClick) {
    var b = el('button', cls, text);
    b.type = 'button';
    b.onclick = onClick;
    return b;
  }
  function sfx(n) { if (SH.Sfx) SH.Sfx.play(n); }

  /* Work out a plain arithmetic question, so a pasted sum can be marked
     even when you do not know the right answer yourself. */
  function trySolve(text) {
    var expr = String(text).replace(/[×x]/g, '*').replace(/[÷]/g, '/').replace(/[−–]/g, '-')
      .replace(/\^/g, '**').replace(/=\s*\?*\s*$/, '').replace(/[?]/g, '').trim();
    if (!/^[-+*/(). \d]+(\*\*[\d.]+)?$/.test(expr.replace(/\*\*/g, '**'))) return null;
    if (!/\d/.test(expr) || !/[-+*/]/.test(expr)) return null;
    try {
      // a tiny shunting-yard evaluator — no eval, no globals reachable
      var value = evaluate(expr);
      return (value == null || !isFinite(value)) ? null : String(Math.round(value * 1e6) / 1e6);
    } catch (e) { return null; }
  }

  function evaluate(src) {
    var tokens = src.match(/\d+(?:\.\d+)?|\*\*|[-+*/()]/g);
    if (!tokens) return null;
    var pos = 0;
    function peek() { return tokens[pos]; }
    function next() { return tokens[pos++]; }
    function primary() {
      var t = next();
      if (t === '(') { var v = addsub(); next(); return v; }
      if (t === '-') return -primary();
      return parseFloat(t);
    }
    function power() {
      var base = primary();
      if (peek() === '**') { next(); return Math.pow(base, power()); }
      return base;
    }
    function muldiv() {
      var v = power();
      while (peek() === '*' || peek() === '/') {
        var op = next();
        var rhs = power();
        v = op === '*' ? v * rhs : v / rhs;
      }
      return v;
    }
    function addsub() {
      var v = muldiv();
      while (peek() === '+' || peek() === '-') {
        var op = next();
        var rhs = muldiv();
        v = op === '+' ? v + rhs : v - rhs;
      }
      return v;
    }
    var result = addsub();
    return pos === tokens.length ? result : null;
  }

  /* ------------------------------ list screen ------------------------------ */

  function renderList(root, onExit) {
    root.innerHTML = '';
    var mistakes = SH.Progress.mistakes();

    var top = el('div', 'lesson-top');
    top.appendChild(btn('close-x', '✕', onExit));
    top.appendChild(el('div', 'quiz-count', 'Coach'));
    top.appendChild(el('div', 'hud-spacer'));
    root.appendChild(top);

    var wrap = el('div', 'wrap');
    wrap.appendChild(el('div', 'mascot center', '🧑‍🏫'));
    wrap.appendChild(el('h1', 'center', 'Go over your mistakes'));
    wrap.appendChild(el('p', 'muted center',
      'Pick a question you got wrong. You say what went wrong, the Coach tells you whether you are right, then you write the answer again.'));

    wrap.appendChild(btn('btn btn--blue btn--wide', '＋ Add a question yourself',
      function () { renderOwn(root, onExit); }));

    if (!mistakes.length) {
      var empty = el('div', 'empty');
      empty.appendChild(el('div', null, 'Nothing to review yet.'));
      empty.appendChild(el('div', 'small', 'Wrong answers from your lessons appear here automatically.'));
      wrap.appendChild(empty);
      root.appendChild(wrap);
      return;
    }

    wrap.appendChild(el('h2', 'section-head', ''));
    wrap.lastChild.appendChild(el('h2', null, mistakes.length + ' to review'));
    wrap.lastChild.appendChild(btn('link', 'Clear all', function () {
      SH.Progress.clearMistakes();
      renderList(root, onExit);
    }));

    var rows = el('div', 'rows');
    mistakes.forEach(function (m) {
      var row = el('button', 'row mistake-row');
      row.type = 'button';
      var main = el('div', 'row-main');
      main.appendChild(el('div', 'row-title', (m.emoji || '📘') + '  ' + m.prompt));
      main.appendChild(el('div', 'row-sub', m.subjectName + ' · ' + m.topicName + ' — you answered "' + m.given + '"'));
      row.appendChild(main);
      row.appendChild(el('div', 'row-num', '›'));
      row.onclick = function () { sfx('tap'); renderReview(root, m, onExit); };
      rows.appendChild(row);
    });
    wrap.appendChild(rows);
    root.appendChild(wrap);
    window.scrollTo(0, 0);
  }

  /* --------------------------- add your own question --------------------------- */

  function renderOwn(root, onExit) {
    root.innerHTML = '';
    var top = el('div', 'lesson-top');
    top.appendChild(btn('close-x', '✕', function () { renderList(root, onExit); }));
    top.appendChild(el('div', 'quiz-count', 'Your own question'));
    top.appendChild(el('div', 'hud-spacer'));
    root.appendChild(top);

    var wrap = el('div', 'wrap');
    wrap.appendChild(el('h1', null, 'Add a question you got wrong'));
    wrap.appendChild(el('p', 'muted', 'Type the question and the answer you gave. If you know the right answer, add it — otherwise the Coach will work out plain sums on its own.'));

    var subject = SH.currentSubject && SH.currentSubject() !== 'chess' ? SH.currentSubject() : 'math';
    var chips = el('div', 'mode-row');
    [['math', '🔢 Math'], ['english', '📖 English'], ['science', '🔬 Science'], ['chinese', '🀄 Chinese']].forEach(function (s) {
      var c = el('button', 'chip' + (s[0] === subject ? ' on' : ''));
      c.type = 'button';
      c.textContent = s[1];
      c.onclick = function () {
        subject = s[0];
        chips.querySelectorAll('.chip').forEach(function (x, i) {
          x.className = 'chip' + (['math', 'english', 'science', 'chinese'][i] === subject ? ' on' : '');
        });
      };
      chips.appendChild(c);
    });
    wrap.appendChild(chips);

    function field(label, placeholder, tag) {
      wrap.appendChild(el('div', 'kicker', label));
      var input = el(tag || 'input', 'type-answer');
      if (tag === 'textarea') input.rows = 3;
      input.placeholder = placeholder;
      input.style.marginBottom = '14px';
      wrap.appendChild(input);
      return input;
    }

    var qInput = field('the question', 'e.g. 4 + 5 × 3 = ?', 'textarea');
    var aInput = field('your answer', 'what you wrote');
    var cInput = field('the correct answer (optional)', 'leave blank for plain sums');

    var error = el('div', 'muted small');
    error.style.marginBottom = '10px';
    wrap.appendChild(error);

    wrap.appendChild(btn('btn btn--wide', 'Start reviewing', function () {
      var prompt = qInput.value.trim(), given = aInput.value.trim(), answer = cInput.value.trim();
      if (!prompt || !given) { error.textContent = 'Please fill in the question and your answer.'; return; }
      if (!answer) {
        answer = trySolve(prompt);
        if (!answer) {
          error.textContent = 'The Coach cannot work this one out by itself — please add the correct answer.';
          return;
        }
      }
      if (Coach.checkAnswer(given, { answer: answer, given: given }).ok) {
        error.textContent = 'That answer looks correct, so there is nothing to review.';
        return;
      }
      renderReview(root, {
        id: 'own' + Date.now(), own: true,
        subject: subject, subjectName: subject.charAt(0).toUpperCase() + subject.slice(1),
        emoji: { math: '🔢', english: '📖', science: '🔬', chinese: '🀄' }[subject],
        topic: 'own', topicName: 'Your question',
        kicker: '', prompt: prompt, given: given, answer: answer, explanation: ''
      }, onExit);
    }));
    root.appendChild(wrap);
    window.scrollTo(0, 0);
  }

  /* ------------------------------ the two steps ------------------------------ */

  function renderReview(root, mistake, onExit) {
    var diagnosis = Coach.diagnose(mistake);
    var step = 1;
    var verdict = null;      // { ok, text } for the current step
    var showHints = false;

    function draw() {
      root.innerHTML = '';

      var top = el('div', 'lesson-top');
      top.appendChild(btn('close-x', '✕', function () { renderList(root, onExit); }));
      var track = el('div', 'track');
      track.style.flex = '1';
      var fill = el('i');
      fill.style.width = (step === 1 ? 33 : step === 2 ? 66 : 100) + '%';
      track.appendChild(fill);
      top.appendChild(track);
      top.appendChild(el('span', 'stat-pill dim', 'Step ' + Math.min(step, 2) + '/2'));
      root.appendChild(top);

      var body = el('div', 'lesson-body');
      body.appendChild(el('div', 'kicker', mistake.subjectName + ' · ' + mistake.topicName));
      if (mistake.passage) body.appendChild(el('div', 'passage', mistake.passage));
      body.appendChild(el('h2', 'prompt', mistake.prompt));

      var yours = el('div', 'your-answer');
      yours.appendChild(el('span', 'your-label', 'You answered'));
      yours.appendChild(el('span', 'your-value', mistake.given));
      body.appendChild(yours);

      if (step === 1) drawStepOne(body);
      else if (step === 2) drawStepTwo(body);
      else drawDone(body);

      root.appendChild(body);
    }

    /* Step 1 — what do you think went wrong? */
    function drawStepOne(body) {
      body.appendChild(el('div', 'kicker', 'step 1 — what went wrong?'));
      body.appendChild(el('p', 'muted small', 'In your own words, say what your mistake was. The Coach will tell you whether you have it right.'));

      var input = el('textarea', 'type-answer');
      input.rows = 3;
      input.placeholder = 'e.g. I did the operations in the wrong order';
      if (verdict) { input.value = verdict.text; input.disabled = true; }
      body.appendChild(input);

      if (showHints && !verdict) {
        var hints = el('div', 'options');
        hints.style.marginTop = '12px';
        diagnosis.hints.forEach(function (h) {
          var b = el('button', 'option');
          b.type = 'button';
          b.appendChild(el('span', null, h));
          b.onclick = function () { input.value = h; sfx('select'); };
          hints.appendChild(b);
        });
        body.appendChild(hints);
      }

      if (verdict) {
        var banner = el('div', 'verdict-box ' + (verdict.ok ? 'ok' : 'no'));
        banner.appendChild(el('strong', null, verdict.ok ? '✓ That is exactly it.' : verdict.unsure ? 'No problem — here is what happened.' : '✗ Not quite.'));
        banner.appendChild(el('div', 'why', diagnosis.cause));
        body.appendChild(banner);
        body.appendChild(btn('btn btn--wide', 'Now write the answer', function () {
          step = 2; verdict = null; draw();
        }));
        return;
      }

      var actions = el('div', 'play-actions');
      actions.appendChild(btn('btn', 'Check my thinking', function () {
        var result = Coach.matchDiagnosis(input.value, diagnosis);
        if (result.empty) return;
        verdict = { ok: result.ok, unsure: result.unsure, text: input.value };
        sfx(result.ok ? 'correct' : 'wrong');
        draw();
      }));
      actions.appendChild(btn('btn btn--ghost', showHints ? 'Hide hints' : 'I am not sure', function () {
        showHints = !showHints;
        draw();
      }));
      body.appendChild(actions);
    }

    /* Step 2 — write it correctly this time. */
    function drawStepTwo(body) {
      body.appendChild(el('div', 'kicker', 'step 2 — write the correct answer'));

      var input = el('input', 'type-answer');
      input.placeholder = 'Your corrected answer';
      if (verdict) { input.value = verdict.text; input.disabled = true; }
      body.appendChild(input);

      if (verdict) {
        var banner = el('div', 'verdict-box ' + (verdict.ok ? 'ok' : 'no'));
        banner.appendChild(el('strong', null, verdict.ok
          ? '✓ Correct' + (verdict.loose ? ' — ' + verdict.loose : '')
          : verdict.repeated ? '✗ That is the same answer as before.' : '✗ Still not right.'));
        if (!verdict.ok) banner.appendChild(el('div', 'why', 'The answer is "' + mistake.answer + '".'));
        if (mistake.explanation) banner.appendChild(el('div', 'why', mistake.explanation));
        body.appendChild(banner);

        var actions = el('div', 'play-actions');
        if (!verdict.ok) {
          actions.appendChild(btn('btn btn--ghost', 'Try again', function () { verdict = null; draw(); }));
        }
        actions.appendChild(btn('btn', 'Done', function () {
          if (!mistake.own) SH.Progress.removeMistake(mistake.id);
          SH.Progress.addXp(8, 1);
          sfx('complete');
          step = 3;
          draw();
        }));
        body.appendChild(actions);
        return;
      }

      var check = btn('btn btn--wide', 'Check my answer', function () {
        var result = Coach.checkAnswer(input.value, mistake);
        if (result.empty) return;
        verdict = { ok: result.ok, loose: result.loose, repeated: result.repeated, text: input.value };
        sfx(result.ok ? 'correct' : 'wrong');
        draw();
      });
      body.appendChild(check);
      setTimeout(function () { input.focus(); }, 0);
    }

    function drawDone(body) {
      var done = el('div', 'verdict-box ok');
      done.appendChild(el('strong', null, '🎯 Reviewed  ·  +8 XP'));
      done.appendChild(el('div', 'why', 'This question has been cleared from your list.'));
      body.appendChild(done);

      var actions = el('div', 'play-actions');
      actions.appendChild(btn('btn', 'Next mistake', function () {
        var remaining = SH.Progress.mistakes();
        if (remaining.length) renderReview(root, remaining[0], onExit);
        else renderList(root, onExit);
      }));
      actions.appendChild(btn('btn btn--ghost', 'Back to the list', function () { renderList(root, onExit); }));
      body.appendChild(actions);
    }

    draw();
    window.scrollTo(0, 0);
  }

  SH.startReview = function (root, opts) { renderList(root, opts.onExit); };
  SH._trySolve = trySolve;
})(window.StudyHub);
</script>
<script>
/* Shell: onboarding, the HUD, the lesson path and the stats pages. */
(function (SH) {
  'use strict';

  var hudEl, appEl;
  var state = { view: 'path', subjectId: 'english', onboardStep: 0, draftAge: null };

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function btn(cls, text, onClick) {
    var b = el('button', cls, text);
    b.type = 'button';
    b.onclick = onClick;
    return b;
  }
  function profile() { return SH.Profile.get(); }
  function stage() { var p = profile(); return p ? p.stageIndex : 2; }

  var COURSE_KEY = 'studyhub.course';

  function go(view, subjectId) {
    state.view = view;
    if (subjectId) {
      state.subjectId = subjectId;
      try { localStorage.setItem(COURSE_KEY, subjectId); } catch (e) {}
    }
    render();
  }
  SH.go = go;
  SH.currentSubject = function () { return state.subjectId; };

  /* ---------------------------- HUD ---------------------------- */
  function renderHud() {
    hudEl.innerHTML = '';
    if (state.view === 'onboard' || state.view === 'lesson') return;

    var bar = el('div', 'hud');
    bar.appendChild(btn('brand', '📚 StudyHub', function () { go('path'); }));
    bar.appendChild(el('div', 'hud-spacer'));

    var data = SH.Progress.all();
    bar.appendChild(el('span', 'stat-pill fire', '🔥 ' + data.streak.current));
    bar.appendChild(el('span', 'stat-pill gem', '💎 ' + data.xp));
    bar.appendChild(el('span', 'stat-pill heart', '❤️ ' + data.hearts.n));
    var pending = SH.Progress.mistakes().length;
    var coachBtn = btn('icon-btn coach-btn', '🧑‍🏫', function () { openCoach(); });
    coachBtn.title = pending ? pending + ' to review' : 'Coach';
    if (pending) coachBtn.appendChild(el('span', 'badge', pending > 9 ? '9+' : String(pending)));
    bar.appendChild(coachBtn);
    bar.appendChild(btn('icon-btn', '📊', function () { go('stats'); }));
    bar.appendChild(btn('icon-btn', '👤', function () { go('profile'); }));
    bar.appendChild(btn('icon-btn', SH.Sfx.muted() ? '🔇' : '🔊', function () {
      SH.Sfx.toggle();
      render();
    }));
    bar.appendChild(btn('icon-btn', document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙',
      function () { SH.Theme.toggle(); render(); }));
    hudEl.appendChild(bar);

    if (state.view !== 'path') return;
    var chips = el('div', 'courses');
    SH.subjects.forEach(function (s) {
      var c = el('button', 'course-chip' + (s.id === state.subjectId ? ' on' : ''));
      c.type = 'button';
      c.style.color = s.id === state.subjectId ? s.color : '';
      c.appendChild(el('span', 'emoji', s.emoji));
      c.appendChild(el('span', null, s.name + (s.native ? ' ' + s.native : '')));
      c.onclick = function () { go('path', s.id); };
      chips.appendChild(c);
    });
    hudEl.appendChild(chips);
  }

  /* ------------------------- onboarding ------------------------- */
  function renderOnboard() {
    appEl.innerHTML = '';
    var box = el('div', 'onboard');

    var dots = el('div', 'step-dots');
    for (var i = 0; i < 3; i++) dots.appendChild(el('i', i <= state.onboardStep ? 'on' : ''));

    if (state.onboardStep === 0) {
      box.appendChild(el('div', 'mascot', '📚'));
      box.appendChild(el('h1', null, 'Welcome to StudyHub'));
      box.appendChild(el('p', null, 'Bite-sized lessons in English, Math, Science and Chinese — matched to your school year.'));
      box.appendChild(dots);
      box.appendChild(btn('btn btn--wide', 'Get started', function () { state.onboardStep = 1; render(); }));
      box.style.maxWidth = '420px';
      box.style.margin = '0 auto';
      appEl.appendChild(box);
      return;
    }

    if (state.onboardStep === 1) {
      box.appendChild(el('div', 'mascot', '🎂'));
      box.appendChild(el('h1', null, 'How old are you?'));
      box.appendChild(el('div', 'speech', 'Your age sets the syllabus — the questions, the vocabulary and the difficulty all follow it.'));

      var grid = el('div', 'age-grid');
      SH.Profile.stages.forEach(function (st, idx) {
        var t = el('button', 'tile' + (state.draftAge != null && SH.Profile.stageForAge(state.draftAge) === idx ? ' sel' : ''));
        t.type = 'button';
        var body = el('div');
        body.appendChild(el('div', null, st.label));
        body.appendChild(el('span', 'tile-sub', st.name));
        t.appendChild(el('span', 'emoji', ['🧸', '🎒', '📐', '🔬', '🎓'][idx]));
        t.appendChild(body);
        t.onclick = function () {
          state.draftAge = Math.min(st.max, Math.max(st.min, st.min + 1));
          render();
        };
        grid.appendChild(t);
      });
      box.appendChild(grid);

      var form = el('form', 'age-input');
      var input = el('input');
      input.type = 'number';
      input.min = '3';
      input.max = '120';
      input.placeholder = 'Exact age';
      if (state.draftAge != null) input.value = state.draftAge;
      form.appendChild(input);
      form.onsubmit = function (e) { e.preventDefault(); saveAge(); };
      box.appendChild(form);

      /* live syllabus preview, updated in place so the field keeps focus */
      var preview = el('p', 'muted small');
      preview.id = 'syllabusPreview';
      box.appendChild(preview);

      function syncAge() {
        var ok = state.draftAge >= 3 && state.draftAge <= 120;
        var next = document.getElementById('ageNext');
        if (next) next.disabled = !ok;
        preview.textContent = ok
          ? 'Syllabus: ' + SH.Profile.stages[SH.Profile.stageForAge(state.draftAge)].name +
            ' · ' + SH.Profile.stages[SH.Profile.stageForAge(state.draftAge)].grades
          : 'Pick a band above or type your exact age.';
      }
      input.oninput = function () {
        var v = parseInt(input.value, 10);
        state.draftAge = isFinite(v) ? v : null;
        syncAge();
      };
      setTimeout(syncAge, 0);

      box.appendChild(dots);
      var next = btn('btn btn--wide', 'Continue', saveAge);
      next.id = 'ageNext';
      next.disabled = !(state.draftAge >= 3 && state.draftAge <= 120);
      box.appendChild(next);
      box.style.maxWidth = '460px';
      box.style.margin = '0 auto';
      appEl.appendChild(box);
      return;
    }

    // step 2: choose the first course
    var p = profile();
    box.appendChild(el('div', 'mascot', '🚀'));
    box.appendChild(el('h1', null, 'Where would you like to start?'));
    box.appendChild(el('p', null, 'You are on the ' + p.stage.name + ' syllabus (' + p.stage.grades + '). You can switch subjects any time.'));
    var list = el('div', 'age-grid');
    list.style.gridTemplateColumns = '1fr';
    SH.subjects.forEach(function (s) {
      var t = el('button', 'tile');
      t.type = 'button';
      t.appendChild(el('span', 'emoji', s.emoji));
      var body = el('div');
      body.appendChild(el('div', null, s.name + (s.native ? '  ' + s.native : '')));
      body.appendChild(el('span', 'tile-sub', s.blurb));
      t.appendChild(body);
      t.onclick = function () { go('path', s.id); };
      list.appendChild(t);
    });
    box.appendChild(list);
    box.appendChild(dots);
    box.style.maxWidth = '460px';
    box.style.margin = '0 auto';
    appEl.appendChild(box);
  }

  function saveAge() {
    if (!(state.draftAge >= 3 && state.draftAge <= 120)) return;
    SH.Profile.set(state.draftAge);
    state.onboardStep = 2;
    render();
  }

  /* --------------------------- the path --------------------------- */
  function renderPath() {
    appEl.innerHTML = '';
    var subject = SH.subject(state.subjectId) || SH.subjects[0];
    var p = profile();
    var st = stage();
    var wrap = el('div', 'wrap');

    /* daily goal */
    var data = SH.Progress.all();
    var doneToday = SH.Progress.xpToday();
    var goal = data.goal;
    var card = el('div', 'goal-card');
    card.appendChild(el('div', 'goal-ring', doneToday >= goal ? '✅' : '🎯'));
    var gb = el('div', 'goal-body');
    gb.appendChild(el('div', 'goal-title', doneToday >= goal ? 'Daily goal complete!' : 'Daily goal'));
    gb.appendChild(el('div', 'muted small', doneToday + ' / ' + goal + ' questions answered today · 🔥 ' + data.streak.current + ' day streak'));
    var track = el('div', 'track');
    var fill = el('i');
    fill.style.width = Math.min(100, Math.round((doneToday / goal) * 100)) + '%';
    track.appendChild(fill);
    gb.appendChild(track);
    card.appendChild(gb);
    wrap.appendChild(card);

    var waiting = SH.Progress.mistakes().length;
    if (waiting) {
      var coachCard = el('button', 'play-card coach-card');
      coachCard.type = 'button';
      coachCard.appendChild(el('span', 'play-emoji', '🧑‍🏫'));
      var cb = el('div', 'play-body');
      cb.appendChild(el('div', 'play-title', waiting + (waiting === 1 ? ' mistake' : ' mistakes') + ' to go over'));
      cb.appendChild(el('div', 'muted small', 'Work out what went wrong, then answer it again'));
      coachCard.appendChild(cb);
      coachCard.appendChild(el('span', 'play-go', '▶'));
      coachCard.onclick = openCoach;
      wrap.appendChild(coachCard);
    }

    if (subject.id === 'chess') {
      var play = el('button', 'play-card');
      play.type = 'button';
      play.appendChild(el('span', 'play-emoji', '♟️'));
      var pb = el('div', 'play-body');
      pb.appendChild(el('div', 'play-title', 'Play against the bot'));
      pb.appendChild(el('div', 'muted small', 'Pick an opponent from beginner to expert, then play a full game'));
      play.appendChild(pb);
      play.appendChild(el('span', 'play-go', '▶'));
      play.onclick = function () {
        SH.Sfx.play('tap');
        state.view = 'lesson';
        renderHud();
        appEl.innerHTML = '';
        SH.startPlay(appEl, { onExit: function () { go('path'); } });
      };
      wrap.appendChild(play);
    }

    var head = el('div', 'section-head');
    var h = el('div');
    h.appendChild(el('h2', null, subject.name + (subject.native ? ' ' + subject.native : '')));
    h.appendChild(el('div', 'muted small', p.stage.name + ' syllabus · ' + p.stage.grades));
    head.appendChild(h);
    wrap.appendChild(head);

    var topics = subject.topics.filter(function (t) { return (t.minStage || 0) <= st; });
    topics.forEach(function (topic, unitIndex) {
      var crowns = SH.Progress.crowns(subject.id, topic.id);
      var prevComplete = unitIndex === 0 || SH.Progress.unitComplete(subject.id, topics[unitIndex - 1].id);

      var unit = el('div', 'unit');
      unit.style.setProperty('--sub', subject.color);
      var left = el('div');
      left.appendChild(el('div', 'unit-title', 'Unit ' + (unitIndex + 1) + ' · ' + topic.name));
      left.appendChild(el('div', 'unit-sub', (topic.stageDesc && topic.stageDesc[st]) || topic.desc));
      unit.appendChild(left);
      unit.appendChild(el('div', 'unit-crowns', '👑 ' + crowns + '/' + SH.Progress.LESSONS_PER_UNIT));
      wrap.appendChild(unit);

      var path = el('div', 'path');
      for (var i = 0; i < SH.Progress.LESSONS_PER_UNIT; i++) {
        (function (lessonIndex) {
          var done = !!SH.Progress.lesson(subject.id, topic.id, lessonIndex);
          var prevLessonDone = lessonIndex === 0 || !!SH.Progress.lesson(subject.id, topic.id, lessonIndex - 1);
          var open = prevComplete && prevLessonDone;
          var isCurrent = open && !done;

          var row = el('div', 'path-row');
          // stepping stones: the path snakes left and right down the page
          row.style.transform = 'translateX(' + [0, 62, 90, 62, 0][lessonIndex] * (unitIndex % 2 ? -1 : 1) + 'px)';

          var node = el('button', 'node' + (done ? ' done' : open ? '' : ' locked') + (isCurrent ? ' current' : ''));
          node.type = 'button';
          node.style.setProperty('--sub', subject.color);
          node.textContent = done ? '👑' : open ? '★' : '🔒';
          node.title = 'Lesson ' + (lessonIndex + 1);
          if (isCurrent) {
            node.appendChild(el('span', 'node-flag', lessonIndex === 0 && crowns === 0 ? 'Start' : 'Continue'));
            row.style.marginTop = '24px';   // room for the flag above the node
          }
          node.onclick = function () {
            SH.Sfx.play('tap');
            if (!open) return lockedModal(subject, topic, lessonIndex);
            startLesson(subject, topic, lessonIndex, done ? 'practice' : 'lesson');
          };
          row.appendChild(node);
          path.appendChild(row);
        })(i);
      }
      wrap.appendChild(path);

      var actions = el('div', 'section-head');
      actions.style.margin = '4px 0 0';
      var practice = btn('btn btn--ghost', '🔁 Practice', function () {
        startLesson(subject, topic, 0, 'practice');
      });
      actions.appendChild(practice);
      if (topic.flashcards) {
        actions.appendChild(btn('btn btn--ghost', '🗂 Cards', function () {
          state.view = 'lesson';
          renderHud();
          appEl.innerHTML = '';
          SH.renderFlashcards(appEl, subject, topic, st, function () { go('path'); });
        }));
      }
      wrap.appendChild(actions);
    });

    appEl.appendChild(wrap);
  }

  function openCoach() {
    SH.Sfx.play('tap');
    state.view = 'lesson';
    renderHud();
    appEl.innerHTML = '';
    SH.startReview(appEl, { onExit: function () { go('path'); } });
  }

  function startLesson(subject, topic, lessonIndex, mode) {
    if (mode === 'lesson' && SH.Progress.hearts() <= 0) return noHeartsModal();
    state.view = 'lesson';
    renderHud();
    appEl.innerHTML = '';
    SH.startLesson(appEl, {
      subject: subject, topic: topic, lesson: lessonIndex, stage: stage(), mode: mode,
      onExit: function () { go('path'); }
    });
  }

  function modal(title, text, buttons) {
    var back = el('div', 'modal-backdrop');
    var box = el('div', 'modal');
    box.appendChild(el('h2', null, title));
    box.appendChild(el('p', null, text));
    buttons.forEach(function (b) {
      box.appendChild(btn(b.cls || 'btn btn--wide', b.label, function () {
        document.body.removeChild(back);
        if (b.action) b.action();
      }));
    });
    back.appendChild(box);
    back.onclick = function (e) { if (e.target === back) document.body.removeChild(back); };
    document.body.appendChild(back);
  }

  function lockedModal(subject, topic, lessonIndex) {
    modal('Locked for now', 'Finish the lessons before it to unlock this one — or jump straight in if you already know the material.', [
      { label: 'Jump ahead', action: function () { startLesson(subject, topic, lessonIndex, 'lesson'); } },
      { label: 'Not yet', cls: 'btn btn--ghost btn--wide' }
    ]);
  }

  function noHeartsModal() {
    var mins = Math.ceil(SH.Progress.msToNextHeart() / 60000);
    modal('Out of hearts', 'The next heart arrives in about ' + mins + ' minute' + (mins === 1 ? '' : 's') +
      '. Practising a finished lesson earns one back straight away.', [
      { label: 'Refill now', action: function () { SH.Progress.refillHearts(); render(); } },
      { label: 'Wait', cls: 'btn btn--ghost btn--wide' }
    ]);
  }

  /* ---------------------------- stats ---------------------------- */
  function renderStats() {
    appEl.innerHTML = '';
    var data = SH.Progress.all();
    var wrap = el('div', 'wrap wrap--wide');
    wrap.appendChild(el('h1', null, 'Your progress'));
    wrap.appendChild(el('p', 'muted', 'Everything is stored on this device only.'));

    var acc = data.totals.asked ? Math.round((data.totals.correct / data.totals.asked) * 100) : 0;
    var crowns = Object.keys(data.lessons).length;
    var grid = el('div', 'stat-grid');
    [['💎', data.xp, 'Total XP'], ['🔥', data.streak.current, 'Day streak'],
     ['👑', crowns, 'Lessons cleared'], ['🎯', acc + '%', 'Accuracy'],
     ['❓', data.totals.asked, 'Questions answered'], ['🏅', data.streak.best, 'Best streak']]
      .forEach(function (s) {
        var c = el('div', 'stat-card');
        c.appendChild(el('div', 'big', s[0]));
        var b = el('div');
        b.appendChild(el('div', 'big', String(s[1])));
        b.appendChild(el('div', 'cap', s[2]));
        c.appendChild(b);
        grid.appendChild(c);
      });
    wrap.appendChild(grid);

    SH.subjects.forEach(function (s) {
      var sub = SH.Progress.subject(s.id);
      wrap.appendChild(el('h2', 'section-head', ''));
      var head = wrap.lastChild;
      head.appendChild(el('h2', null, s.emoji + '  ' + s.name));
      head.appendChild(el('span', 'muted small',
        sub.asked ? Math.round((sub.correct / sub.asked) * 100) + '% over ' + sub.asked + ' questions' : 'not started'));

      var rows = el('div', 'rows');
      s.topics.forEach(function (t) {
        var stats = SH.Progress.topic(s.id, t.id);
        var crownCount = SH.Progress.crowns(s.id, t.id);
        var row = el('div', 'row');
        var main = el('div', 'row-main');
        main.appendChild(el('div', 'row-title', t.name));
        var track = el('div', 'track blue');
        var fill = el('i');
        fill.style.width = Math.round((crownCount / SH.Progress.LESSONS_PER_UNIT) * 100) + '%';
        track.appendChild(fill);
        main.appendChild(track);
        row.appendChild(main);
        row.appendChild(el('div', 'row-num',
          stats.asked ? Math.round((stats.correct / stats.asked) * 100) + '%' : '—'));
        row.appendChild(el('div', 'row-num', '👑 ' + crownCount));
        rows.appendChild(row);
      });
      wrap.appendChild(rows);
    });

    appEl.appendChild(wrap);
  }

  /* --------------------------- profile --------------------------- */
  function renderProfile() {
    appEl.innerHTML = '';
    var p = profile();
    var wrap = el('div', 'wrap');
    wrap.appendChild(el('h1', null, 'Your syllabus'));

    var card = el('div', 'goal-card');
    card.appendChild(el('div', 'goal-ring', '🎓'));
    var body = el('div', 'goal-body');
    body.appendChild(el('div', 'goal-title', 'Age ' + p.age + ' · ' + p.stage.name));
    body.appendChild(el('div', 'muted small', p.stage.grades));
    card.appendChild(body);
    wrap.appendChild(card);

    wrap.appendChild(el('h2', 'section-head', ''));
    wrap.lastChild.appendChild(el('h2', null, 'What you are studying'));
    var rows = el('div', 'rows');
    SH.subjects.forEach(function (s) {
      s.topics.filter(function (t) { return (t.minStage || 0) <= p.stageIndex; }).forEach(function (t) {
        var row = el('div', 'row');
        var main = el('div', 'row-main');
        main.appendChild(el('div', 'row-title', s.emoji + '  ' + t.name));
        main.appendChild(el('div', 'row-sub', (t.stageDesc && t.stageDesc[p.stageIndex]) || t.desc));
        row.appendChild(main);
        rows.appendChild(row);
      });
    });
    wrap.appendChild(rows);

    wrap.appendChild(el('h2', 'section-head', ''));
    wrap.lastChild.appendChild(el('h2', null, 'Settings'));

    var goalRow = el('div', 'row');
    var goalMain = el('div', 'row-main');
    goalMain.appendChild(el('div', 'row-title', 'Daily goal'));
    goalMain.appendChild(el('div', 'row-sub', 'Questions to answer each day'));
    goalRow.appendChild(goalMain);
    [10, 30, 50].forEach(function (g) {
      var b = btn('btn btn--ghost' + (SH.Progress.all().goal === g ? ' sel' : ''), String(g), function () {
        SH.Progress.setGoal(g);
        render();
      });
      b.style.minHeight = '38px';
      b.style.padding = '6px 12px';
      if (SH.Progress.all().goal === g) { b.style.borderColor = 'var(--green)'; b.style.color = 'var(--green)'; }
      goalRow.appendChild(b);
    });
    wrap.appendChild(goalRow);

    var actions = el('div', 'rows');
    actions.appendChild(btn('btn btn--ghost btn--wide', 'Change my age', function () {
      state.draftAge = p.age;
      state.onboardStep = 1;
      go('onboard');
    }));
    actions.appendChild(btn('btn btn--ghost btn--wide', 'Refill hearts', function () {
      SH.Progress.refillHearts();
      render();
    }));
    actions.appendChild(btn('btn btn--red btn--wide', 'Reset all progress', function () {
      modal('Reset everything?', 'This clears your XP, streak, crowns and age. It cannot be undone.', [
        { label: 'Yes, reset', cls: 'btn btn--red btn--wide', action: function () {
          SH.Progress.reset();
          SH.Profile.clear();
          state.onboardStep = 0;
          state.draftAge = null;
          go('onboard');
        } },
        { label: 'Cancel', cls: 'btn btn--ghost btn--wide' }
      ]);
    }));
    wrap.appendChild(actions);

    appEl.appendChild(wrap);
  }

  /* ---------------------------- render ---------------------------- */
  function render() {
    if (!profile() && state.view !== 'onboard') state.view = 'onboard';
    renderHud();
    if (state.view === 'onboard') return renderOnboard();
    if (state.view === 'stats') return renderStats();
    if (state.view === 'profile') return renderProfile();
    if (state.view === 'lesson') return;   // the lesson runner owns the screen
    renderPath();
  }

  document.addEventListener('DOMContentLoaded', function () {
    hudEl = document.getElementById('hud');
    appEl = document.getElementById('app');
    SH.Theme.init();
    try {
      var saved = localStorage.getItem(COURSE_KEY);
      if (saved && SH.subject(saved)) state.subjectId = saved;
    } catch (e) {}
    if (!profile()) { state.view = 'onboard'; state.onboardStep = 0; }
    render();
  });
})(window.StudyHub);
</script>
</body>
</html>
